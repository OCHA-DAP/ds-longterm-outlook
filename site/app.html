  (animate ? cov.transition().duration(350) : cov).attr("r", covR);
  [0, 1, 2].forEach(i => { const d = sel.select(`.b-d${i}`); (animate ? d.transition().duration(350) : d).attr("r", n => R.get(n)[i]); });
  const dots = sel.select(".b-dots");
  (animate ? dots.transition().duration(350) : dots).attr("r", n => vals.get(n).era5 ? R.get(n)[1] : 0);
  sel.select(".b-peak").attr("opacity", n => inPeak(n.c, m) ? 1 : 0);
  d3.select("#map").selectAll("g.fives > g").attr("opacity", n => vals.get(n).p5 > 0 ? 1 : 0);
  sel.attr("data-tip", n => mapTip(n, m, vals.get(n)));
  const has = L.nodes.filter(n => n.outer > 0).map(n => vals.get(n)).filter(x => x.v > 0 || x.has), tot = has.reduce((s, x) => s + x.v, 0);
  const ofAll = L.nodes.filter(n => n.outer > 0).length;
  const scen = OURS(state.layer) && state.scen !== "none" ? ` (incl. the ${esc(SCEN_NAME[state.scen])} scenario)` : "";
  $("#mlabel").innerHTML = `<b>${monLabel(m)}</b>${m === BUILT_MONTH ? " (this month)" : ""} · ` + ({
    lean: `${fmt(tot)} counted in an affected lean season, all countries${scen}`,
    dry: `${fmt(tot)} counted in areas with a dry signal, all countries${scen}`,
    ipc: `${fmt(tot)} in IPC/CH Phase 3+ in the ${has.length} of ${ofAll} countries with a period covering this month`,
    fews: `at least ${fmt(tot)} in Phase 3+ before assistance in the ${has.length} of ${ofAll} countries with a FEWS NET figure for this month`,
  })[state.layer] + (() => {
    const f = L.nodes.filter(n => vals.get(n).p5 > 0).map(n => n.c.name);
    if (OURS(state.layer) || !f.length) return "";
    const list = f.length === 1 ? f[0] : `${f.length} countries (${f.join(", ")})`;
    return state.layer === "fews" ? ` · Phase 5 in the peak estimates drawn this month: ${list}` : ` · Phase 5 in ${list}`;
  })();
  // strip above the map: the same all-countries total for every month; click a bar to go there
  const per = AX.map(mm => L.nodes.filter(n => n.outer > 0).map(n => mapDiscs(n, mm)).filter(x => x.v > 0 || x.has));
  const tots = per.map(xs => xs.reduce((s, x) => s + x.v, 0)), mx = Math.max(1, ...tots), bw = (MAP_W - 20) / AX.length;
  $("#mbars").innerHTML = AX.map((mm, i) => {
    const h = Math.max(tots[i] ? 1.5 : 0, 32 * tots[i] / mx), {y, m: mo} = ym(mm);
    const ttl = `<title>${monLabel(mm)}: ${fmt(tots[i])}, ${per[i].length} ${per[i].length === 1 ? "country" : "countries"}</title>`;
    return `<rect data-i="${i}" class="${i === mi ? "on" : ""}" x="${(10 + i * bw + 1).toFixed(1)}" y="${(36 - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}">${ttl}</rect>`
      + `<rect data-i="${i}" class="hit" x="${(10 + i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="52">${ttl}</rect>`
      + (mo === 1 || i === 0 || i === mi ? `<text x="${(10 + i * bw + bw / 2).toFixed(1)}" y="49"${i === mi ? ` style="fill:var(--n9);font-weight:500"` : ""}>${MON[mo - 1]}${mo === 1 || i === 0 ? ` ${String(y).slice(2)}` : ""}</text>` : "");
  }).join("");
}

function mapTip(n, m, mv) {
  const c = n.c, o = WEIGHTS[state.weight], src = o.src, w = wsel(c);
  const L = [`<b>${esc(c.name)}</b> · ${monLabel(m)}`];
  const ip = ipcAt(c, m), fx = fewsAt(c, m);
  // a projection can cover only part of the country (Sudan's second projection: 8M of 48M analysed)
  const allMax = c.ipc ? Math.max(0, ...c.ipc.periods.map(p => p.all || 0)) : 0;
  const ipcLine = p => `IPC/CH ${esc(p.t)}, ${esc(rangeLabel(p.s, p.e))} (analysis ${esc(c.ipc.analysis)}): Phase 3+ ${fmt(p.p3)} · 4+ ${fmt(p.p4)} · 5 ${fmt(p.p5)}`
    + (p.all ? ` · ${fmt(p.all)} people analysed${p.all < 0.8 * allMax ? ` (${fmt(allMax)} in another period of this analysis: this one covers part of the country)` : ""}` : "");
  const fewsLine = x => `FEWS NET ${x.kind === "current" ? "estimate" : "most likely projection"} for ${monLabel(m)}, from the ${monLabel(x.brief)} brief: ${esc(fewsRange(x))} in Phase 3+ before assistance`
    + (x.fdw != null ? ` (the Data Warehouse also gives ${fmt(x.fdw)} for this bin; the circle uses the bin's lower edge)` : "");
  const pk = c.fews_peak;
  const peakLine = () => { const q = peakPhases(pk), ph = pk.phases || {};
    return `FEWS NET peak-needs estimate (edition ${esc(rangeLabel(pk.edition[0], pk.edition[1]))}), peak ${esc(rangeLabel(pk.peak[0], pk.peak[1]))}: ${esc(fewsRange(pk))} in Phase 3+ before assistance`
      + `<br>Phase 3: ${binTxt(ph.p3)} · Phase 4: ${binTxt(ph.p4)} · Phase 5: ${binTxt(ph.p5)}` + (pk.pct_phase && pk.pct_phase[1] != null ? ` (${pk.pct_phase.map((x, i) => `${x ?? "—"}% in Phase ${i + 3}`).join(", ")})` : "")
      + (ph.p5 ? "" : "<br>No Phase 5 in the peak estimate"); };
  if (state.layer === "ipc" && n.outer > 0) L.push(`Population the latest analysis covers (the circle): ${fmt(n.outer)}`);
  if (state.layer === "fews" && n.outer > 0) L.push(`National population, World Bank ${c.population.y} (the circle): ${fmt(n.outer)}${mv.peak && pk.pct && pk.pct[0] != null ? ` · FEWS NET puts ${pk.pct[0]}–${pk.pct[1]}% of the population in Phase 3+ at the peak (on its own population figures)` : ""}`);
  if (state.layer === "ipc") L.push(ip ? ipcLine(ip) + (ip.p5 > 0 ? `<br><b>Phase 5: ${fmt(ip.p5)} people</b>` : "") : `No period of the latest IPC/CH analysis${c.ipc ? ` (${esc(c.ipc.analysis)})` : ""} covers this month, so there is no IPC/CH figure for it`);
  else if (state.layer === "fews") {
    if (mv.peak) L.push(peakLine() + (fx ? (mv.newer
        ? `<br>Phase 3+ drawn from the ${monLabel(fx.brief)} brief, newer than the peak edition: ${esc(fewsRange(fx))}; Phase 4+ and 5 from the peak estimate`
        : `<br>Monthly figure for ${monLabel(m)} from the ${monLabel(fx.brief)} brief, older than the peak edition and not drawn: ${esc(fewsRange(fx))}`) : ""));
    else if (fx) L.push(fewsLine(fx) + "<br>FEWS NET publishes its monthly figures as Phase 3+ only");
    else {
      const ser = (c.fews_faob && c.fews_faob.series) || [], last = ser.length ? ser[ser.length - 1].month : null;
      L.push(!ser.length ? `FEWS NET's monthly brief does not cover ${esc(c.name)}${pk && pk.peak ? `; its peak-needs estimate is drawn in the peak months (${esc(rangeLabel(pk.peak[0], pk.peak[1]))})` : ""}`
        : m > last ? `No FEWS NET figure for this month: its monthly briefs reach ${esc(monLabel(last))}`
        : `No FEWS NET figure for this month: no monthly brief gave one for ${esc(c.name)}`);
    }
  }
  if (!w || !w.total) L.push(`No ${src === "hnrp" ? "HNRP" : "IPC/CH"} admin-level figures for ${OURS(state.layer) ? "this count" : esc(o.label)}`);
  else {
    if (OURS(state.layer)) {
      L.push(`${src === "hnrp" ? `HNRP ${w.e.year ?? ""} PiN, all severities, in the admin units counted` : "Population of the admin units with IPC/CH figures"} (the circle): ${fmt(outerOf(c, src))}`
        + (src === "hnrp" && c.hnrp && c.hnrp.in_need && Math.abs(c.hnrp.in_need - outerOf(c, src)) > 0.02 * c.hnrp.in_need ? ` (plan total ${fmt(c.hnrp.in_need)})` : "")
        + ` · ${esc(o.short)}${w.pinOnly ? " (PiN, no severity split)" : ""}: ${fmt(w.total)}`);
      if (src === "hnrp" && w.e.pbs) L.push(`PiN by severity: 3: ${fmt(w.e.pbs[2])} · 4: ${fmt(w.e.pbs[3])} · 5: ${fmt(w.e.pbs[4])}`);
    }
    const lv = leanVal(w, m), d = dryVal(w, m), names = leanNames(c, w, m);
    L.push(`${OURS(state.layer) ? "" : `Ours (${esc(o.short)}): `}in a lean season after a dry rainy season: ${fmt(lv.v)} (${pct(lv.v / w.total)})${names.length ? ` · ${esc(names.join("; "))}` : ""}`);
    if (OURS(state.layer) && d && !d.off) L.push(`Dry signal, ${esc(d.s.label)}${d.scen ? ` (${esc(SCEN_NAME[state.scen])})` : ""}: ${fmt(d.v)} (${pct(d.v / w.total)})`);
    if (mv.era5) L.push("Relies on ERA5, which overstated the 2026 deficit here");
  }
  if (pk && pk.peak && !mv.peak) L.push(`FEWS NET peak needs: ${esc(fewsRange(pk))}, ${esc(rangeLabel(pk.peak[0], pk.peak[1]))}${inPeak(c, m) ? " (includes this month)" : ""}`);
  if (state.layer !== "fews" && fx) L.push(fewsLine(fx));
  if (state.layer !== "ipc" && ip) L.push(ipcLine(ip));
  L.push(`<span style="opacity:.75">Click for the country page</span>`);
  return L.join("<br>");
}

function mapLegend(L) {
  const o = WEIGHTS[state.weight], src = o.src, lay = state.layer, [c0, c1, c2] = DISC_CLASS[lay];
  const yr = (D.countries.find(c => c.population) || {population: {}}).population.y;
  const outerTxt = src === "hnrp" ? "HNRP PiN, all severities, in the admin units counted" : "Population of the admin units with IPC/CH figures";
  // one circle, rings outermost first: [label, class]
  const rings = {
    lean: [[outerTxt, "b-out"], [`${o.label}: the people counted`, c0], ["Of those, in a lean season after a dry rainy season, this month", c1]],
    dry: [[outerTxt, "b-out"], [`${o.label}: the people counted`, c0], ["Of those, with a dry signal in the trimester centred on this month", c1]],
    ipc: [["Population the latest IPC/CH analysis covers", "b-out hatch"], ["Population analysed in the period covering this month", "b-cov"], ["Phase 3+", c0], ["Phase 4+", c1], ["Phase 5", c2]],
    fews: [[`National population (World Bank ${yr})`, "b-out"], ["Phase 3+ before assistance (lower bound from FEWS NET's ranges)", c0], ["Phase 4+ (peak months only)", c1], ["Phase 5 (peak months only)", c2]],
  }[lay];
  // the top half of one circle, each ring labelled by a horizontal line from the centre line
  const R0 = 72, rIn = 12, n = rings.length, cx = R0 + 4, cy = R0 + 10, lx = cx + R0 + 18;
  const rr = rings.map((_, i) => R0 - i * (R0 - rIn) / (n - 1));
  const lines = rings.map(([label], i) => {
    const y = cy - (i + 1 < n ? (rr[i] + rr[i + 1]) / 2 : rr[i] / 2);
    return `<line class="halo" x1="${cx}" x2="${lx - 4}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><line class="lead" x1="${cx}" x2="${lx - 4}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`
      + `<circle class="dot" cx="${cx}" cy="${y.toFixed(1)}" r="2"/><text x="${lx}" y="${(y + 4).toFixed(1)}">${esc(label)}</text>`;
  }).join("");
  const W = lx + 8 + Math.max(...rings.map(([t]) => t.length)) * 6.1, H = cy + 4;
  const diagram = `<svg width="${W.toFixed(0)}" height="${H}" viewBox="0 0 ${W.toFixed(0)} ${H}" role="img" aria-label="What the circles show">`
    + `<defs><clipPath id="mlg-top"><rect x="0" y="0" width="${2 * cx}" height="${cy}"/></clipPath></defs><g clip-path="url(#mlg-top)">`
    + rings.map(([, cls], i) => `<circle cx="${cx}" cy="${cy}" r="${rr[i].toFixed(1)}" class="${cls}"/>`).join("")
    + `</g><line x1="${cx - R0 - 2}" x2="${cx + R0 + 2}" y1="${cy}" y2="${cy}" stroke="var(--n4)"/>` + lines + `</svg>`;
  // the other marks, each with its own small icon
  const icon = inner => `<svg width="30" height="26" viewBox="-15 -13 30 26">${inner}</svg>`;
  const marks = [[`<circle r="8" class="b-out"/><circle r="11" class="b-peak"/>`, "Dashed ring: the month is in FEWS NET's peak-needs window"]];
  if (!OURS(lay)) marks.push([`<g class="b-five"><circle r="6.5"/><text>5</text></g>`, lay === "fews" ? "Phase 5 in FEWS NET's peak estimate (it gives no Phase 5 figure outside the peak months)" : "Phase 5 reported this month (usually too few people to see as a disc)"]);
  marks.push(...(OURS(lay)
    ? [[`<circle r="10" class="b-out"/><circle r="7" class="c-lean"/><circle r="7" fill="url(#era5dots)"/>`, "Dotted: relies on ERA5, which overstated the 2026 Sahel deficit"],
       [`<circle r="4" fill="none" stroke="var(--n6)" stroke-dasharray="1.5 1.5"/>`, "No figures for this count"]]
    : [[`<circle r="10" class="b-out hatch"/>`, lay === "ipc" ? "Hatched: not analysed in the month shown (no period covers it, or the period covers part of the country). It does not mean no one is in need." : "Hatched: no FEWS NET figure for the month shown. It does not mean no one is in need."],
       [`<circle r="4" fill="none" stroke="var(--n6)" stroke-dasharray="1.5 1.5"/>`, lay === "ipc" ? "No IPC/CH figure in any of the months shown" : "No FEWS NET figure in any of the months shown"]]));
  const side = marks.map(([g, t]) => `${icon(g)}<span>${t}</span>`).join("");
  // size key: three round values below the largest circle
  const cand = [1e5, 2.5e5, 5e5, 1e6, 2e6, 5e6, 1e7, 2e7, 5e7, 1e8, 2e8];
  const big = Math.max(1, ...L.nodes.map(x => x.outer)), top = cand.filter(v => v <= big * .9).pop() || cand[0];
  const keys = [top, cand.filter(v => v <= top / 4).pop(), cand.filter(v => v <= top / 16).pop()].filter(Boolean);
  const kr = keys.map(v => L.k * Math.sqrt(v)), KR = kr[0], KH = 2 * KR + 6, kcx = KR + 2;
  const kl = v => v >= 1e6 ? `${v / 1e6}M` : `${v / 1e3}k`;
  const sizeKey = `<svg class="key" width="${(2 * KR + 48).toFixed(0)}" height="${KH.toFixed(0)}" viewBox="0 0 ${(2 * KR + 48).toFixed(0)} ${KH.toFixed(0)}" aria-label="Circle sizes">` + keys.map((v, i) => {
    const r = kr[i], t = KH - 2 - 2 * r;
    return `<circle cx="${kcx.toFixed(1)}" cy="${(KH - 2 - r).toFixed(1)}" r="${r.toFixed(1)}" fill="none" stroke="var(--n6)"/>`
      + `<line x1="${kcx.toFixed(1)}" x2="${(2 * KR + 8).toFixed(1)}" y1="${t.toFixed(1)}" y2="${t.toFixed(1)}" stroke="var(--n4)" stroke-dasharray="2 2"/>`
      + `<text x="${(2 * KR + 11).toFixed(1)}" y="${(t + 3.5).toFixed(1)}">${kl(v)}</text>`;
  }).join("") + `</svg>`;
  return `<div class="mlg">${diagram}<div class="side">${side}</div>${sizeKey}</div>
    <p class="mlg-note">Circle area is people, on one scale per layer. Circles are moved apart where they would overlap, so they sit near each country rather than exactly on it. The bars above the map add up the countries with a figure in each month${OURS(lay) ? "" : "; for IPC/CH and FEWS NET that number changes from month to month (hover a bar)"}. ${lay === "fews" ? `FEWS NET publishes its monthly figures as Phase 3+ only (a current estimate up to ${esc(monLabel(M.sources.faob_brief))}, then the most likely projection made six months earlier); it splits only its peak-needs estimate by phase. ` : ""}${OURS(lay) ? "" : "The count chosen above is not used. "}Click a circle for the country page.</p>`;
}

// ---- ENSO panel + method -----------------------------------------------------------------------
function ensoPanel() {
  const e = M.enso, iri = e.iri;
  const ph = e.latest.roni >= M.thresholds.enso ? "El Niño" : e.latest.roni <= -M.thresholds.enso ? "La Niña" : "neutral";
  const rows = iri.seasons.map(([s, n, z, a]) => `<tr><td>${esc(s)}</td><td class="num">${n ?? "—"}${n != null ? "%" : ""}</td><td class="num">${z ?? "—"}${z != null ? "%" : ""}</td><td class="num">${a ?? "—"}${a != null ? "%" : ""}</td></tr>`).join("");
  return `<h2>ENSO and the forecast horizon</h2>
  <div class="enso">
    <div>
      <div class="tile"><div class="k">ENSO now · CPC relative index</div><div class="v">${e.latest.roni > 0 ? "+" : ""}${e.latest.roni.toFixed(2)} °C</div><div class="d">${esc(e.latest.season)} · ${ph}</div></div>
      <table style="margin-top:10px"><thead><tr><th>Season</th><th class="num">El Niño</th><th class="num">Neutral</th><th class="num">La Niña</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="small muted">${esc(iri.source)}, ${esc(iri.published)}. ${esc(iri.note)} <a href="${esc(iri.url)}" target="_blank" rel="noopener">Source</a></p>
    </div>
    <div class="method">
      <p>SEAS5's ${esc(M.issuance.label)} run covers seasons to <b>${monLabel(windowBounds().seasEnd)}</b>. For the rest of the year, the last columns are <b>three ENSO scenarios</b>. For each admin unit and season, we count how often the season was in the driest third of ERA5's ${e.obs_years[0]}–${e.obs_years[1]} record when ENSO was in that phase. The phase comes from CPC's relative Niño3.4 index over that same season. A scenario counts a unit only where that happened significantly more often than chance: a binomial test against one in three, p &lt; ${M.thresholds.scen_alpha}, with at least ${M.thresholds.scen_n} years of the phase. Neutral years are close to climatology almost everywhere, so the neutral scenario is near zero and is left out of the all-countries views and the table; country pages show it.</p>
      <p>It is a conditional climatology: it shows where seasons have more often been dry in a given ENSO phase, and it does not forecast this year's seasons. ${esc(iri.summary || "")} <span class="muted">(${esc(iri.published)})</span></p>
    </div>
  </div>`;
}

function peakEditions() {
  const n = {};
  D.countries.forEach(c => { if (c.fews_peak) { const k = rangeLabel(c.fews_peak.edition[0], c.fews_peak.edition[1]); n[k] = (n[k] || 0) + 1; } });
  return Object.entries(n).sort((x, y) => y[1] - x[1]).map(([k, v]) => `${k}: ${v} countries`).join("; ");
}
function planYears() {
  const ys = [...new Set(D.countries.filter(c => c.hnrp).map(c => c.hnrp.year))].sort();
  return ys.length ? ys.join(" or ") + " plans" : "no current plans";
}

function methodSection() {
  const s = M.sources, t = M.thresholds;
  return `<details><summary>How to read this</summary><div class="method"><ul>
    <li><b>Exposure.</b> Our figures count today's caseload, by admin unit, in areas where a season in the window is dry. They do not estimate how the caseload will change.</li>
    <li><b>Dry signal.</b> For the season ending and the SEAS5 forecast, a unit counts where the trimester is part of its rainy season (≥ ${Math.round(t.rainy_share * 100)}% of annual rain), SEAS5 has at least moderate skill there (r ≥ ${t.r_min}), and the forecast is a 1-in-${t.rp_min}-year dry season or worse. These are the same rules as the SEAS5 viewer's Forecast × HNRP tab. “Rainy season” here is a share-of-rain rule; the crop calendars are used only for the timing of impact.</li>
    <li><b>Season ended / ending.</b> The six trimesters that ended in the six months before SEAS5 was issued are fully observed (ERA5). They count as dry when the season ranks in its own driest third of the record. They are kept so that a season that has just ended is still linked to the lean season that follows it. As more months pass after a season ends, fewer of these trimesters cover it, so its result can change from one monthly update to the next. The trimesters under way at issuance have two or one of their three months observed and the rest forecast; their harvests are linked to next year's lean season. ERA5 overstated the 2026 deficit across the Sahel: it ranked Chad's July–September season as the driest on record, at 23% of normal, while CHIRPS had 64–70%. Figures that rely on ERA5 in these countries are flagged (dotted fill, or an ERA5 label).</li>
    <li><b>Timing of impact.</b> Where FEWS NET publishes a seasonal calendar, each rainy season is linked to its harvest and then to the first lean season after that harvest. In pastoral areas it is linked to the first pastoral lean season after the rains. This follows the reasoning in FEWS NET's projections: a poor season mainly affects food security in the next lean season. A person counts once in a month even when two lean seasons overlap (Somalia's pastoral and cropping lean seasons share October). “Lean season most affected” in the table is the current or upcoming lean season (across one or more calendar regions) with the most people counted in areas with a dry signal; lean seasons that have already ended are left out of it. The calendars are our transcriptions of FEWS NET's images, and we assigned admin units to calendar regions; both are shown on each country page.</li>
    <li><b>By month.</b> Each country has four lines on the same months: the dry signal by trimester (placed on its middle month), the lean season that follows a dry rainy season, FEWS NET's peak-needs window, and the IPC/CH current period and projections. Shading is the share of the people counted, so a small country can be as dark as a large one; the number on the right is the largest month in people, from this month on. Countries are grouped by region and sorted by the people counted.</li>
    <li><b>Map.</b> Each circle is the population the layer's figures are a share of. Our layers: the HNRP PiN of all severities, or the population of the admin units with IPC/CH figures; the grey disc is the people counted; the inner disc is those of them in an affected lean season (or with a dry signal) in the month shown. IPC/CH layer: the population the latest analysis covers; a white disc for the people analysed in the period covering the month (a projection can cover only part of a country, leaving the rest hatched), and Phase 3+, 4+ and 5 inside it. FEWS NET layer: the national population (World Bank). FEWS NET publishes no analysed population, and its own percentages use its own population figures, so tooltips give those percentages as published. The FEWS NET layer shows FEWS NET's figures, Phase 3+ before assistance, at the lower end of its ranges: the current estimate in each monthly brief, and for months after the latest brief the most likely projection made six months earlier. FEWS NET publishes these monthly figures as Phase 3+ only; it splits only its annual peak-needs estimate by phase, so in each country's peak months the FEWS NET layer shows that estimate as Phase 3+, 4+ and 5. On the IPC/CH layer a “5” marks a month with people in Phase 5; on the FEWS NET layer it can show only in peak months. On both, a grey hatched circle a month with no figure (no analysis or estimate covers it), which does not mean no one is in need. Circles start on each country's label point (Natural Earth) in an equal-area projection and are moved apart where they would overlap.</li>
    <li><b>Calendar regions.</b> On country pages, the small map beside each calendar region (hover for a larger one) shows the admin units we placed in it, on the SEAS5 viewer's boundaries.</li>
    <li><b>Who is counted.</b> HNRP PiN by JIAF severity class (one plan year per country, shown under the name); where a plan publishes no severity split, its PiN. IPC/CH Phase 3+ or 4+ population for one analysis period per country, the one covering today where possible. “Either” counts a unit once even when several seasons are dry.</li>
    <li><b>Other organisations' figures are not comparable with each other.</b> FEWS NET counts people in Phase 3+ <i>before</i> planned food assistance, as a range: the peak over a 12-month edition (${esc(peakEditions())}) or by month (monthly brief). IPC/CH counts Phase 3+ for an analysis period after assistance is taken into account. HNRP PiN is multi-sector and fixed for the plan year. A Sudan IPC projection may cover only part of the country.</li>
    <li><b>Funding</b> is each country's current plan (${esc(planYears())}): FTS funding to date against its current (revised) requirements. It is not next year's plan.</li>
    <li><b>Sources.</b> ${ext("https://ocha-dap.github.io/ds-seas5-skill/app/", "SEAS5 viewer")} (${esc(M.issuance.label)} issuance) ·
      HNRP and FTS via the ${ext("https://ocha-dap.github.io/ds-hnrp-mirror/", "HNRP mirror")} (refreshed ${esc((s.hnrp_generated || "").slice(0, 10))}) ·
      IPC/CH via the ${ext("https://ocha-dap.github.io/ds-ipc-mirror/", "IPC mirror")} (${esc((s.ipc_generated || "").slice(0, 10))}) and ${ext("https://www.ipcinfo.org/", "ipcinfo.org")} ·
      FEWS NET ${ext(s.peak_url, "peak needs brief")}, ${ext(s.faob_url, "monthly outlook brief")} and ${ext("https://fdw.fews.net/", "Data Warehouse")} (fetched ${esc(s.fdw_fetched)}; peak-needs edition loaded ${esc(s.peak_created)}, latest monthly brief loaded ${esc(s.faob_brief)}; key drivers are only in FEWS NET's PDFs) ·
      FEWS NET seasonal calendars from each ${ext("https://fews.net/", "FEWS NET")} country page ·
      ${ext("https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/", "CPC relative Niño3.4 index")} ·
      ${ext(M.enso.iri.url, "IRI ENSO forecast")} ·
      ${ext("https://data.worldbank.org/indicator/SP.POP.TOTL", "World Bank national population")} (the FEWS NET map layer) ·
      map: ${ext("https://www.naturalearthdata.com/", "Natural Earth")} 1:110m via world-atlas; calendar-region maps: the SEAS5 viewer's admin boundaries.</li>
  </ul></div></details>`;
}

// ---- country view ------------------------------------------------------------------------------
function renderCountry(iso3) {
  stopPlay();
  const c = D.countries.find(x => x.iso3 === iso3);
  if (!c) { location.hash = ""; return; }
  $("#title").textContent = c.name;
  const b = windowBounds();
  $("#lede").innerHTML = `Outlook ${monLabel(b.first)} – ${monLabel(b.end)} · SEAS5 ${esc(M.issuance.label)} · <a href="#/${state.view}" style="color:#fff">all countries</a>`;
  const v = $("#view");
  v.innerHTML = `
    <p><a href="#/${state.view}">← All countries</a></p>
    <div class="banner"><b>Rainfall and seasonal calendars only.</b> These figures count people in areas with a rainfall-based dry signal. They do not include conflict, displacement or economic drivers.</div>
    ${countryLinks(c)}
    ${tiles(c)}
    <h2>Month by month</h2>
    <p class="method">FEWS NET's projections link a poor rainy season to the following lean season: poor rains lead to a poor harvest (or poor pasture and water), household stocks and income run out earlier, and the <b>next lean season</b> starts earlier and is more severe. Below, each rainy season on FEWS NET's calendar is filled with our dry signal, and each lean season with the people counted in areas where the rains that lead to it are dry (counting a unit once when two rainy seasons lead to the same lean season). Other organisations' timing is on the same months underneath.</p>
    <div class="controls"><span><span class="ctl-label">Count</span>${weightToggle()}</span></div>
    <div class="tbl-wrap" style="border:0">${countryGrid(c, AX)}</div>
    ${gridLegend()}
    ${calendarNotes(c)}
    ${unitsTable(c)}
    ${countryNotes(c)}`;
  bindWeight(() => renderCountry(iso3));
  scrollTo(0, 0);
}

function calendarNotes(c) {
  if (!c.calendar) return "";
  const w = wsel(c), RX = w && w.e.regions ? w.e.regions : {}, out = [];
  const regs = c.calendar.regions;
  if (regs.length === 1) {
    const r = regs[0], R = RX[r.id];
    out.push(`Calendar region: ${esc([r.name, cleanWhere(r.where), r.livelihood, R ? `${R.units} admin unit${R.units === 1 ? "" : "s"} mapped here` : ""].filter(Boolean).join(" · "))}.`);
  }
  if (RX.unassigned && w) out.push(`${RX.unassigned.units} admin unit(s) with ${fmt(RX.unassigned.totals[w.key])} counted could not be placed in a calendar region.`);
  out.push(`Calendar transcribed by OCHA CHD from FEWS NET's seasonal calendar ${ext(c.calendar.image_url, "image")} (months rounded to whole months: a month counts when a bar covers at least half of it). Admin units placed in regions by us from the regions' titles and locator maps: ${esc(c.calendar.assign_method || "")}`);
  return `<p class="small muted">${out.join(" ")}</p>`;
}

function tiles(c) {
  const out = [];
  const h = c.hnrp, hx = c.exposure.hnrp;
  if (h) {
    let pbs = "";
    if (hx && hx.pbs) {
      const tot = hx.pbs.reduce((a, b) => a + b, 0) || 1;
      const cols = ["var(--n2)", "var(--n3)", "var(--w4)", "var(--w6)", "var(--w8)"];
      pbs = `<div class="pbs" data-tip="${esc(`<b>PiN by severity, ${hx.year}</b><br>` + hx.pbs.map((x, i) => `Class ${i + 1}: ${fmt(x)}`).join("<br>"))}">${hx.pbs.map((x, i) => x ? `<i style="width:${x / tot * 100}%;background:${cols[i]}"></i>` : "").join("")}</div>
        <div class="d">Severity 3: ${fmt(hx.pbs[2])} · 4: ${fmt(hx.pbs[3])} · 5: ${fmt(hx.pbs[4])}</div>`;
    } else if (hx) pbs = `<div class="d">No severity split published; PiN only</div>`;
    out.push(`<div class="tile"><div class="k">HNRP ${h.year} people in need</div><div class="v">${fmt(h.in_need)}</div><div class="d">${esc(h.code)}</div>${pbs}</div>`);
  }
  const ip = ipcShown(c);
  if (ip) out.push(`<div class="tile"><div class="k">IPC/CH Phase 3+ · ${esc(ip.t)}</div><div class="v">${fmt(ip.p3)}</div><div class="d">${esc(rangeLabel(ip.s, ip.e))} · Phase 4+: ${fmt(ip.p4)} · analysis ${esc(c.ipc.analysis)}</div></div>`);
  const pk = c.fews_peak;
  if (pk) out.push(`<div class="tile"><div class="k">FEWS NET peak needs</div><div class="v">${esc(fewsRange(pk))}</div><div class="d">Peak ${esc(rangeLabel(...(pk.peak || [])))}${pk.pct && pk.pct[0] != null ? ` · ${pk.pct[0]}–${pk.pct[1]}% of population` : ""}${pk.vs_last_year ? ` · ${esc(pk.vs_last_year.toLowerCase())} than last year` : ""}</div></div>`);
  if (h && h.coverage != null) out.push(`<div class="tile"><div class="k">${h.year} plan funding (FTS)</div><div class="v">${pct(h.coverage)}</div><div class="d">${usd(h.funding)} of ${usd(h.requirements)} to date · ${h.year} plan, not next year's</div></div>`);
  return out.length ? `<div class="tiles">${out.join("")}</div>` : "";
}

function unitsTable(c) {
  const w = wsel(c);
  const top = w && w.e.top ? w.e.top[w.key] : null;
  if (!top || !top.length) return "";
  const o = WEIGHTS[state.weight];
  const winBy = Object.fromEntries(WIN.map(s => [s.key, s]));
  const rows = top.map(u => {
    const chips = u.seasons.map(s => {
      const sl = winBy[s.key];
      if (s.cat === "scenario") return `<span class="c-label lab-src">${esc(sl.label)} · ${s.phases.map(p => ({nino: "El Niño", neutral: "neutral", nina: "La Niña"}[p])).join(", ")}</span>`;
      // the RP tops out at n+1 (46 with 45 years): that is "driest in the record", not a 1-in-46 estimate
      return `<span class="c-label lab-warn">${esc(sl.label)}${s.cat === "observed" ? " (observed)" : ""} · ${s.rp >= 45 ? "driest on record" : `1-in-${Math.round(s.rp)} yr`}${c.era5_caveat && (s.cat === "observed" || s.cat === "ending") ? " · ERA5 ⚠" : ""}</span>`;
    }).join("");
    return `<tr><td>${esc(u.name)}${u.parent ? `<span class="sub">${esc(u.parent)}</span>` : ""}</td><td class="num">${fmt(u[w.key])}</td><td>${chips}</td></tr>`;
  }).join("");
  return `<h3>Admin units with a dry signal: the ${top.length} with the most people counted</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Admin unit</th><th class="num">${esc(w.pinOnly ? "PiN" : o.short)}</th><th>Dry seasons (orange: observed/forecast, return period; grey: ENSO scenario)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function countryNotes(c) {
  const n = [];
  const hx = c.exposure.hnrp, ix = c.exposure.ipc;
  if (c.era5_caveat) n.push(`ERA5 overstated the 2026 rainy-season deficit across the Sahel belt (Chad: driest on record in ERA5, 64–70% of normal in CHIRPS). The season-ending figures here rely on ERA5 for their observed months and are likely too high.`);
  if (hx && hx.mode === "pin") n.push(`No HNRP severity split is published for ${esc(c.name)}; the HNRP counts use admin-level PiN (${hx.year ?? "year n/a"}), so the severity 3+ and 4+ options show total PiN.`);
  if (hx && hx.dropped) n.push(`${hx.dropped} of ${hx.units} HNRP admin units carry no ${hx.year} severity split and are not counted.`);
  if (hx && hx.pbs && c.hnrp && c.hnrp.in_need) {
    const sum = hx.pbs.reduce((a, b) => a + b, 0), gap = (c.hnrp.in_need - sum) / c.hnrp.in_need;
    if (Math.abs(gap) > 0.02) n.push(`PiN by severity across the admin units adds up to ${fmt(sum)}, against ${fmt(c.hnrp.in_need)} in the plan (${gap > 0 ? "short by" : "over by"} ${pct(Math.abs(gap))}). The admin breakdown and the plan total are published separately.`);
  }
  const w = wsel(c);
  if (w && w.total) {
    const b1 = w.e.blind.seas5[w.key] / w.total, b2 = w.e.blind.scenario[w.key] / w.total;
    if (b1 > 0.02) n.push(`${pct(b1)} of the people counted here (${fmt(w.e.blind.seas5[w.key])}) are in admin units with no SEAS5 forecast in the viewer's data, so they cannot show a season-ending or forecast signal.`);
    if (b2 > 0.02) n.push(`${pct(b2)} of the people counted here (${fmt(w.e.blind.scenario[w.key])}) are in admin units with no ERA5 history to match, so they cannot show an ENSO-scenario signal.`);
  }
  const shown = ipcShown(c);
  if (ix && shown && shown.all && ix.totals.wall < 0.8 * shown.all)
    n.push(`The admin-level IPC/CH figures cover ${fmt(ix.totals.wall)} of the ${fmt(shown.all)} people in the national analysis (they use the ${esc(ix.label)} ${esc(ix.period_type)}), so the IPC/CH counts on this page are partial.`);
  if (ix && ix.older_than_national) n.push(`The IPC/CH counts use the ${esc(ix.analysis)} analysis (${esc(ix.period_type)}, ${esc(ix.label)}), the one in the SEAS5 viewer's data; a newer analysis (${esc(c.ipc.analysis)}) is in the IPC figures above.`);
  if (c.fews_peak && c.fews_peak.areas) n.push(`FEWS NET areas of highest concern: ${esc(c.fews_peak.areas)}.`);
  if (c.calendar) {
    const dryRegions = c.calendar.regions.filter(r => !(r.rainy || []).some(x => !x.minor && ((x.end - x.start + 12) % 12 + 1) < 11)).map(r => r.name);
    if (dryRegions.length) n.push(`FEWS NET's calendar shows only minor or year-round rains, or none, for ${esc(dryRegions.join(", "))}, so these areas are not linked to a lean season here.`);
    const sub = c.calendar.regions.flatMap(r => (r.lean || []).filter(l => l.kind === "pastoral" && (l.name || "").includes(":")).map(l => l.name));
    if (sub.length) n.push(`${esc(sub.join("; "))}: FEWS NET labels this pastoral lean season for a sub-area only, so it is shown but not used to determine the lean season affected.`);
    for (const r of c.calendar.regions) {
      const named = (r.lean || []).filter(l => l.kind !== "pastoral" && (l.name || "").includes(":"));
      if (named.length > 1) n.push(`FEWS NET's calendar gives ${c.calendar.regions.length > 1 ? esc(r.name) : esc(c.name)} separate lean seasons for different areas (${esc(named.map(l => l.name).join("; "))}) and does not say which admin units are in each. The rains are linked to the first of them after the harvest, so everyone counted here is placed in that one.`);
    }
  }
  return n.length ? `<h3>Notes</h3><div class="note"><ul style="margin:0;padding-left:18px">${n.map(x => `<li>${x}</li>`).join("")}</ul></div>` : "";
}

// ---- router ------------------------------------------------------------------------------------
// #/ or #/month: all countries by month · #/map · #/table · #/ISO3: one country
function route() {
  const h = location.hash;
  const m = h.match(/^#\/([A-Z]{3})$/);
  if (m) return renderCountry(m[1]);
  const v = (h.match(/^#\/(month|map|table)$/) || [])[1];
  state.view = v || "month";
  renderGlobal();
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
