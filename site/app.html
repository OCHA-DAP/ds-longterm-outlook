<!DOCTYPE html>

<style>
/* HDX v2 tokens (hdx-ai-hub styles plugin, assets/tokens.css), the subset this page uses.
   Light mode only, like the team's other Pages sites. */
:root {
  color-scheme: light;
  --b05:#e9f5f1; --b1:#d4eae4; --b5:#269777; --b6:#1e795f; --b7:#18614c;
  --n0:#fff; --n01:#fafbfb; --n05:#f5f7f7; --n1:#ebeff0; --n15:#e2e8e8; --n2:#d8e0e1;
  --n3:#c4d0d1; --n4:#b1c1c2; --n6:#7e8e8f; --n7:#5e6a6b; --n8:#3f4748; --n9:#1f2324;
  --w05:#fbf4ea; --w1:#f6e9d4; --w4:#dda555; --w6:#aa7222; --w7:#7f5619; --w8:#553911;
  --e1:#f3dad7; --e7:#762920; --p5:#1862d8; --p05:#e8effb; --p7:#0e3b82;
  /* share ramps, validated (dataviz validate_palette --ordinal): one hue each, light->dark.
     Amber (HDX warning 4/6/7/8): dry signal on the rains. Red (HDX error 3/5/6/8): the lean
     season that follows. */
  --s1:#dda555; --s2:#aa7222; --s3:#7f5619; --s4:#553911;
  --r1:#dc8f86; --r2:#c44536; --r3:#9d372b; --r4:#4e1c16;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--n05); color: var(--n9);
  font: 400 14px/1.5 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
a { color: var(--b6); }
.home-link { display: inline-block; margin: 10px 12px; padding: 6px 12px; font: 500 13px/1 'Roboto', system-ui, sans-serif;
  color: var(--b6); background: var(--b05); border: 1px solid var(--b1); border-radius: 4px; text-decoration: none; }
.home-link:hover { background: var(--b1); }
.wrap { max-width: 1440px; margin: 0 auto 40px; background: var(--n0); box-shadow: 0 0 40px rgba(31,35,36,.06); }
.hero { background: var(--b6); color: #fff; padding: 34px 36px 28px; }
.eyebrow { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; margin: 0 0 10px; opacity: .9; }
.hero h1 { font-family: 'Merriweather', Georgia, serif; font-size: 28px; line-height: 1.25; margin: 0 0 10px; }
.hero p { margin: 0; max-width: 90ch; font-size: 14.5px; line-height: 1.6; }
main { padding: 22px 36px 30px; }
h2 { font-family: 'Merriweather', Georgia, serif; font-size: 20px; margin: 26px 0 10px; color: var(--n9); }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--n7); margin: 22px 0 8px; }
.banner { background: var(--w05); border-left: 5px solid var(--w4); padding: 11px 15px; border-radius: 4px;
  color: var(--n8); font-size: 13.5px; margin: 0 0 16px; }
.note { background: var(--b05); border-left: 5px solid var(--b5); padding: 11px 15px; border-radius: 4px;
  color: var(--n8); font-size: 13px; margin: 12px 0; }
.muted { color: var(--n7); }
.small { font-size: 12px; }
/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 6px 0 12px; }
.seg { display: inline-flex; border: 1px solid var(--n3); border-radius: 4px; overflow: hidden; vertical-align: middle; }
.seg button { font: 500 12.5px 'Roboto', sans-serif; padding: 7px 11px; border: 0; background: var(--n0); color: var(--n8); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--n3); }
.seg button[aria-pressed="true"] { background: var(--b6); color: #fff; }
.ctl-label { font-size: 12px; color: var(--n7); margin-right: 6px; }
.off { opacity: .4; pointer-events: none; }
.btn { font: 500 12.5px 'Roboto', sans-serif; padding: 7px 12px; border: 1px solid var(--b6); background: var(--b6); color: #fff; border-radius: 4px; cursor: pointer; min-width: 84px; }
input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--n3); border-radius: 4px; width: 200px; }
/* table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--n15); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 5px; border-bottom: 1px solid var(--n1); vertical-align: top; text-align: left; }
thead th { background: var(--n05); font-weight: 500; color: var(--n8); font-size: 12px; position: sticky; top: 0; z-index: 1; }
thead tr.grp th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--n7); border-bottom: 0; padding-bottom: 2px; }
thead tr.grp th.ours { color: var(--w7); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--b6); }
th .arrow { color: var(--b6); font-size: 10px; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.sep, th.sep { border-left: 2px solid var(--n15); }
tbody tr:hover td { background: var(--n01); }
td .sub { display: block; font-size: 11px; color: var(--n7); white-space: nowrap; }
.cbar { display: block; height: 4px; background: var(--n1); border-radius: 2px; margin-top: 4px; min-width: 48px; }
.cbar i { display: block; height: 4px; border-radius: 2px; }
.c-label { display: inline-block; font-size: 10.5px; line-height: 1; padding: 3px 6px; border-radius: 2px; margin: 1px 3px 1px 0; white-space: nowrap; }
.lab-src { background: var(--n1); color: var(--n8); }
.lab-warn { background: var(--w1); color: var(--w8); }
.lab-err { background: var(--e1); color: var(--e7); }
.trend-Higher { color: var(--e7); } .trend-Lower { color: var(--b7); } .trend-Similar { color: var(--n7); }
.cname a { font-weight: 500; text-decoration: none; }
.cname a:hover { text-decoration: underline; }
/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 10px 0 6px; }
.tile { border: 1px solid var(--n15); border-radius: 4px; padding: 12px 14px; }
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--n7); }
.tile .v { font-size: 22px; font-weight: 500; margin: 4px 0 2px; }
.tile .d { font-size: 12px; color: var(--n7); }
.pbs { display: flex; height: 8px; border-radius: 2px; overflow: hidden; margin-top: 7px; gap: 2px; }
.pbs i { display: block; height: 8px; }
/* month grid: the country page, and each country opened in the all-countries calendar */
.mg { display: grid; column-gap: 1px; row-gap: 2px; align-items: center; font-size: 11px; min-width: 1000px; }
.mg.sub { grid-column: 1 / -1; grid-template-columns: subgrid; min-width: 0; }
.rl { grid-column: 1; padding: 0 8px 0 4px; color: var(--n8); font-size: 11.5px; line-height: 1.2; }
.rl small { display: block; color: var(--n7); font-size: 10px; }
.mh { text-align: center; color: var(--n7); font-size: 10px; border-bottom: 1px solid var(--n2); padding: 1px 0; white-space: nowrap; overflow: hidden; }
.mh.y { color: var(--n9); font-weight: 500; letter-spacing: -.03em; }
.mh.now { color: var(--p7); font-weight: 700; }
.now-col { align-self: stretch; pointer-events: none; box-shadow: inset 1px 0 0 var(--p5), inset -1px 0 0 var(--p5); }
.band { height: 16px; line-height: 16px; font-size: 9.5px; text-align: center; text-transform: uppercase; letter-spacing: .06em; border-radius: 2px; white-space: nowrap; overflow: hidden; }
.band.ending { background: var(--n1); color: var(--n8); }
.band.forecast { background: var(--p05); color: var(--p7); }
.band.scenario { background: var(--n05); color: var(--n7); border: 1px dashed var(--n3); line-height: 14px; }
.cell2 { height: 26px; border-radius: 2px; display: flex; flex-direction: column; justify-content: center; text-align: center; line-height: 1.1; overflow: hidden; white-space: nowrap; }
.cell2 .t { font-size: 9px; opacity: .85; }
.cell2 .x { font-size: 11px; font-weight: 500; }
.cell2.none { background: var(--n05); color: var(--n7); }
.cell2.offseason { background: repeating-linear-gradient(135deg, var(--n05) 0 4px, var(--n1) 4px 6px); color: var(--n6); }
.bar { height: 20px; line-height: 16px; padding: 2px 6px; border-radius: 2px; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scen { background: var(--n0); border: 2px dashed var(--n3); color: var(--n9); }
.bar.scen, .bar.cal-lean { line-height: 12px; }
.cal-rain { background: #bddbe9; color: var(--p7); }
.cal-rain.minor { background: #ddeef5; }
.cal-harv { background: #0d5d40; color: #fff; border-radius: 6px; height: 15px; line-height: 15px; padding: 0 6px; font-size: 10px; }
.cal-lean { background: var(--n0); border: 2px solid #e8413e; color: #b3201c; }
.ended { opacity: .55; }
/* relies on ERA5, which overstated the 2026 Sahel deficit: a row of white dots along the bottom */
.era5 { background-image: radial-gradient(circle, rgba(255,255,255,.95) 1px, transparent 1.3px); background-size: 4px 4px; background-repeat: repeat-x; background-position: 0 100%; }
.gbar { background: var(--n6); color: #fff; }
.gbar.light { background: var(--n3); color: var(--n9); }
.gcell { text-align: center; font-size: 10.5px; color: var(--n8); background: var(--n1); border-radius: 2px; padding: 3px 1px; white-space: nowrap; overflow: hidden; }
.grp-row { grid-column: 1 / -1; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--n7); border-top: 1px solid var(--n2); padding: 5px 0 1px 4px; margin-top: 3px; }
.reg-row { grid-column: 1 / -1; font-size: 12px; padding: 5px 0 0 4px; }
/* calendar-region locator maps: the region's admin units filled, the rest of the country grey */
.zone { display: inline-flex; align-items: center; gap: 6px; cursor: help; vertical-align: middle; }
.zmap { display: block; flex: none; }
.zmap path { fill: var(--n2); stroke: var(--n2); stroke-width: .4; stroke-linejoin: round; }
.zmap path.na { fill: var(--n1); stroke: var(--n1); }
.zmap path.on { fill: var(--b6); stroke: var(--b6); }
.tip .zmap { margin: 6px 0 4px; }
.tip .zmap path { fill: #5e6a6b; stroke: #5e6a6b; }
.tip .zmap path.na { fill: #3f4748; stroke: #3f4748; }
.tip .zmap path.on { fill: #8fd5bf; stroke: #8fd5bf; }
/* all-countries calendar */
.gc { display: grid; column-gap: 1px; row-gap: 0; align-items: center; min-width: 1080px; font-size: 11px; }
.g-reg { grid-column: 1 / -1; font-size: 12.5px; color: var(--n7); padding: 16px 0 3px; }
.g-reg b { font-family: 'Merriweather', Georgia, serif; font-size: 15px; color: var(--n9); margin-right: 6px; }
.g-name { grid-column: 1; padding: 3px 8px 3px 2px; font-size: 12.5px; line-height: 1.2; cursor: pointer; border-radius: 2px; }
.g-name:hover, .g-name:focus-visible { color: var(--b6); outline: none; background: var(--n01); }
.g-name .tw { display: inline-block; width: 12px; color: var(--n6); font-size: 10px; }
.g-name .sub { display: block; font-size: 10.5px; color: var(--n7); padding-left: 12px; }
.g-name.nofig { color: var(--n7); }
.g-bg { grid-column: 2 / -2; height: 7px; margin: 1px 0; background: var(--n05); }
.g-c, .g-bar { height: 7px; margin: 1px 0; border-radius: 1px; }
.g-bar.fews { background: var(--n8); }
.g-bar.ipc { background: var(--n3); margin-left: 1px; }
.g-bar.ipc.cur { background: var(--n4); }
.g-end { grid-column: -2 / -1; text-align: right; font-size: 12px; padding-left: 6px; line-height: 1.2; }
.g-end .sub { display: block; font-size: 10.5px; color: var(--n7); }
.g-sep { grid-column: 1 / -1; height: 4px; border-bottom: 1px solid var(--n1); margin-bottom: 3px; }
.g-exp { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; row-gap: 2px; background: var(--n01); border: 1px solid var(--n15); border-radius: 4px; padding: 6px 0 8px; margin: 3px 0 6px; }
.g-exp-h { grid-column: 1 / -1; padding: 0 8px 4px; font-size: 12px; color: var(--n7); }
/* map */
.mapbox { border: 1px solid var(--n15); border-radius: 4px; background: #fbfcfc; }
#map { display: block; width: 100%; height: auto; }
#map .land path { fill: var(--n1); stroke: var(--n0); stroke-width: .6; }
#map .land path.ours { fill: var(--n15); }
#map .bub { cursor: pointer; }
.b-out { fill: var(--n0); fill-opacity: .92; stroke: var(--n6); stroke-width: 1; }
.c-grey { fill: var(--n3); } .c-lean { fill: var(--r2); } .c-dry { fill: var(--s2); }
/* IPC phase colours (IPC manual 3.1): Phase 3 / 4 / 5 */
.c-p3 { fill: #e67800; } .c-p4 { fill: #c80000; } .c-p5 { fill: #640000; }
.b-peak { fill: none; stroke: var(--n9); stroke-width: 1.5; stroke-dasharray: 3 2; }
.b-out.hatch { fill: url(#nodata); fill-opacity: 1; stroke: var(--n4); }
.b-cov { fill: var(--n0); }
/* map legend: one circle with each ring labelled */
.mlg { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-start; margin: 10px 0 6px; font-size: 12px; color: var(--n8); }
.mlg > svg { flex: none; }
.mlg .side svg { flex: none; overflow: visible; }
.mlg svg text { font: 11.5px 'Roboto', sans-serif; fill: var(--n8); }
.mlg .lead { fill: none; stroke: var(--n7); stroke-width: .8; }
.mlg .halo { fill: none; stroke: #fff; stroke-width: 3; }
.mlg .dot { fill: var(--n9); }
.mlg .side { display: grid; grid-template-columns: 30px 1fr; gap: 6px 8px; align-items: center; max-width: 330px; }
.mlg .key text { font-size: 10.5px; fill: var(--n7); }
.mlg-note { font-size: 11.5px; color: var(--n7); margin: 0 0 14px; }
.b-five { pointer-events: none; }
.b-five circle { fill: #640000; stroke: #fff; stroke-width: 1.2; }
.b-five text { font: 700 9px 'Roboto', sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
#map .nofig .b-out { fill: none; stroke-dasharray: 1.5 1.5; }
#map .b-lab { font: 500 10px 'Roboto', sans-serif; fill: var(--n9); text-anchor: middle; dominant-baseline: central;
  paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 2.5px; pointer-events: none; }
#mbars { display: block; width: 100%; height: auto; margin: 2px 0 6px; cursor: pointer; }
#mbars rect { fill: var(--n3); }
#mbars rect.on { fill: var(--n9); }
#mbars rect.hit { fill: transparent; }
#mbars text { font: 400 10px 'Roboto', sans-serif; fill: var(--n7); text-anchor: middle; }
.mapctl { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mapctl input[type=range] { width: 280px; accent-color: var(--b6); }
.map-legend { align-items: flex-start; }
.map-legend svg { flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: var(--n7); margin: 8px 0 14px; align-items: center; }
.legend .sw { display: inline-block; width: 18px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; width: 100%; }
.links { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 4px 0 12px; font-size: 12.5px; }
.links a { display: inline-block; padding: 4px 9px; border: 1px solid var(--b1); background: var(--b05); border-radius: 3px; text-decoration: none; color: var(--b7); }
.links a:hover { background: var(--b1); }
.tip { position: fixed; z-index: 10; pointer-events: none; max-width: 340px; background: var(--n9); color: #fff; padding: 8px 10px;
  border-radius: 4px; font-size: 12px; line-height: 1.45; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.tip b { font-weight: 500; }
details { margin: 10px 0; }
details summary { cursor: pointer; font-weight: 500; color: var(--b6); }
.method { font-size: 13px; color: var(--n8); max-width: 100ch; }
.method li { margin: 4px 0; }
.enso { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 18px; align-items: start; }
.enso table { font-size: 12.5px; }
@media (max-width: 760px) {
  .hero { padding: 26px 18px 22px; } main { padding: 16px 16px 24px; } .enso { grid-template-columns: 1fr; }
  .hero h1 { font-size: 23px; }
}
</style>
</head>
<body>
<a class="home-link" href="../">← Humanitarian outlook</a>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">OCHA Centre for Humanitarian Data · internal draft</p>
    <h1 id="title">Year-ahead outlook by country</h1>
    <p id="lede"></p>
  </header>
  <main id="view"></main>
</div>
<div id="tip" class="tip" hidden></div>
<script>
const D = /*__DATA__*/null;
const M = D.meta, WIN = M.window, BUILT_MONTH = M.built.slice(0, 7);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function fmt(v) {
  if (v == null || isNaN(v)) return "—";
  if (v === 0) return "0";
  if (v >= 1e7) return (v / 1e6).toFixed(0) + "M";
  if (v >= 1e6) return (v / 1e6).toFixed(1) + "M";
  if (v >= 1e4) return Math.round(v / 1e3) + "k";
  if (v >= 1e3) return (v / 1e3).toFixed(1) + "k";
  return "<1k";
}
const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
const usd = v => v == null ? "—" : v >= 1e9 ? "$" + (v / 1e9).toFixed(1) + "B" : "$" + fmt(v);
function ym(s) { const [y, m] = s.split("-").map(Number); return {y, m}; }
function monLabel(s) { const {y, m} = ym(s); return `${MON[m - 1]} ${y}`; }
function rangeLabel(a, b) {
  if (!a) return "";
  const A = ym(a), B = ym(b || a);
  if (a === (b || a)) return `${MON[A.m - 1]} ${A.y}`;
  return A.y === B.y ? `${MON[A.m - 1]}–${MON[B.m - 1]} ${B.y}` : `${MON[A.m - 1]} ${A.y}–${MON[B.m - 1]} ${B.y}`;
}
function addMonths(s, k) { const {y, m} = ym(s); const t = y * 12 + (m - 1) + k; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, "0")}`; }
function monthIndex(s) { const {y, m} = ym(s); return y * 12 + m - 1; }
const ymS = t => `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, "0")}`;

// ---- weights: which people we count in each admin unit -------------------------------------
const WEIGHTS = {
  hnrp4: {label: "HNRP PiN · severity 4+", short: "PiN sev. 4+", src: "hnrp", key: "w4"},
  hnrp3: {label: "HNRP PiN · severity 3+", short: "PiN sev. 3+", src: "hnrp", key: "w3"},
  ipc3:  {label: "IPC/CH Phase 3+", short: "IPC 3+", src: "ipc", key: "w3"},
  ipc4:  {label: "IPC/CH Phase 4+", short: "IPC 4+", src: "ipc", key: "w4"},
};
const SCEN_NAME = {none: "No scenario", nino: "El Niño persists", neutral: "ENSO neutral", nina: "La Niña develops"};
const PH_NAME = {nino: "El Niño", neutral: "neutral", nina: "La Niña"};
const state = {weight: "hnrp4", sort: {key: "known", dir: -1}, q: "", view: "month", scen: "none",
  showAll: false, open: new Set(), layer: "lean", mapMonth: BUILT_MONTH};
try { const s = sessionStorage.getItem("outlook-weight"); if (s && WEIGHTS[s]) state.weight = s; } catch (e) {}
try { const s = sessionStorage.getItem("outlook-scen"); if (s && SCEN_NAME[s] && s !== "neutral") state.scen = s; } catch (e) {}

function wsel(c, wk = state.weight) {
  const o = WEIGHTS[wk], e = c.exposure[o.src];
  if (!e) return null;
  const pinOnly = o.src === "hnrp" && e.mode === "pin";
  const key = pinOnly ? "wall" : o.key;
  return {e, key, pinOnly, total: e.totals[key]};
}
function basisNote(c, w) {
  const o = WEIGHTS[state.weight];
  if (o.src === "hnrp") return w.pinOnly ? `PiN ${w.e.year ?? ""}, no severity split` : `HNRP ${w.e.year} PiN by severity`;
  return `${w.e.analysis.slice(0, 4)} analysis · ${rangeLabel(w.e.s, w.e.e)}`;
}
function shareClass(sh) {
  if (sh == null || sh <= 0) return null;
  return sh < 0.1 ? 1 : sh < 0.33 ? 2 : sh < 0.66 ? 3 : 4;
}
const SHARE_COL = {1: "var(--s1)", 2: "var(--s2)", 3: "var(--s3)", 4: "var(--s4)"};
const DRY_COL = SHARE_COL;
const LEAN_COL = {1: "var(--r1)", 2: "var(--r2)", 3: "var(--r3)", 4: "var(--r4)"};
// text on a filled cell: white from the step where dark text loses contrast
const inkOn = (k, kind) => k >= (kind === "lean" ? 2 : 3) ? "#fff" : "var(--n9)";
const stripes = col => `repeating-linear-gradient(135deg, ${col} 0 2px, transparent 2px 4px)`;

// ---- the month axis every view shares ---------------------------------------------------------
// from the middle month of the first trimester drawn to the last month with anything to draw:
// a lean season fed by an observed or forecast dry season, or another organisation's window
const MI0 = monthIndex(M.months[0]);
// (with a scenario chosen, also to the last lean season fed by that scenario's dry seasons)
function buildAxis(scen) {
  const first = addMonths(WIN.find(s => s.shown).start, 1);
  let end = addMonths(WIN[WIN.length - 1].start, 1);
  const ext = m => { if (m && m > end) end = m; };
  for (const c of D.countries) {
    for (const e of Object.values(c.exposure)) {
      if (!e || !e.monthly) continue;
      const src = scen === "none" ? e.monthly.known : e.monthly.scen[scen] || {};
      for (const a of Object.values(src)) for (let i = a.length - 1; i >= 0; i--) if (a[i]) { ext(M.months[i]); break; }
    }
    if (c.fews_peak && c.fews_peak.peak) ext(c.fews_peak.peak[1]);
    if (c.fews_faob) c.fews_faob.projected.forEach(p => ext(p.month));
  }
  const cap = M.months[M.months.length - 1];
  if (end > cap) end = cap;
  const out = [];
  for (let m = first; m <= end; m = addMonths(m, 1)) out.push(m);
  return out;
}
const AXES = {none: buildAxis("none"), nino: buildAxis("nino"), nina: buildAxis("nina")};
const AX = AXES.none;                          // country pages
const gAX = () => AXES[state.scen] || AX;      // all-countries views
// trimester by its middle month (cells sit on the middle month)
const SLOT_AT = Object.fromEntries(WIN.filter(s => s.shown).map(s => [addMonths(s.start, 1), s]));

function series(w, kind, ph) {
  const mo = w && w.e.monthly;
  if (!mo) return null;
  const s = kind === "scen" ? mo.scen[ph] : mo[kind];
  return (s && s[w.key]) || null;
}
const at = (a, m) => a ? (a[monthIndex(m) - MI0] || 0) : 0;
// people counted in a lean season that follows a dry rainy season, in month m (once each, however
// many lean seasons overlap). With a scenario: plus the lean seasons fed by its dry seasons.
function leanVal(w, m, scen = state.scen) {
  const known = at(series(w, "known"), m);
  const v = scen !== "none" ? Math.max(known, at(series(w, "scen", scen), m)) : known;
  return {known, v, obs: at(series(w, "obs"), m)};
}
// people in areas with a dry signal in the trimester centred on month m
function dryVal(w, m, scen = state.scen) {
  const s = SLOT_AT[m];
  if (!s || !w) return null;
  const sl = w.e.slots[s.key];
  if (s.cat !== "scenario") return {s, v: sl[w.key] || 0, scen: false};
  if (scen === "none") return {s, v: 0, scen: true, off: true};
  return {s, v: sl[`${scen}_${w.key}`] || 0, scen: true};
}
function leanNames(c, w, m, scen = state.scen) {
  const out = [], regs = (c.calendar && c.calendar.regions) || [];
  for (const [rid, R] of Object.entries(w.e.regions || {})) for (const im of R.imp || []) {
    if (im.s > m || im.e < m) continue;
    const kv = im.known[w.key] || 0, sv = scen !== "none" ? (im.scen[scen][w.key] || 0) : 0;
    if (!kv && !sv) continue;
    const rn = regs.length > 1 ? (regs.find(r => r.id === rid) || {}).name : null;
    out.push(`${im.name}${im.kind === "livestock" && !/pastoral/i.test(im.name) ? " (pastoral)" : ""}${rn ? `, ${rn}` : ""}${kv ? "" : ` (${PH_NAME[scen]} scenario only)`}`);
  }
  return [...new Set(out)];
}
// the largest value from this month on, and the months at that value (as runs)
function peakOf(vals, months) {
  let v = 0;
  months.forEach((m, i) => { if (m >= BUILT_MONTH && vals[i] > v) v = vals[i]; });
  if (!v) return null;
  const runs = [];
  months.forEach((m, i) => {
    if (m < BUILT_MONTH || vals[i] !== v) return;
    const r = runs[runs.length - 1];
    if (r && addMonths(r[1], 1) === m) r[1] = m; else runs.push([m, m]);
  });
  return {v, runs, label: runs.map(([a, b]) => rangeLabel(a, b)).join(", ")};
}
const inPeak = (c, m) => !!(c.fews_peak && c.fews_peak.peak && c.fews_peak.peak[0] <= m && m <= c.fews_peak.peak[1]);
function iriTip() {
  const iri = M.enso.iri;
  return `<b>Beyond SEAS5: ENSO scenarios</b><br>For each admin unit and season, how often the season was dry in past years of that ENSO phase. This is a conditional climatology: it does not forecast this year's season.<br>${esc(iri.source)}, ${esc(iri.published)}: ` + iri.seasons.map(([s, n]) => `${esc(s)} El Niño ${n}%`).join(" · ");
}

// ---- external links ----------------------------------------------------------------------------
const ext = (href, text) => href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)} ↗</a>` : "";
function countryLinks(c) {
  const L = [];
  if (c.links.fews) L.push(ext(c.links.fews.page, "FEWS NET country page"));
  if (c.calendar) L.push(ext(c.calendar.image_url, "FEWS NET seasonal calendar (image)"));
  if (c.links.ipc) L.push(ext(c.links.ipc.link, c.links.ipc.exact ? `IPC/CH: ${c.links.ipc.title}` : `IPC/CH: latest analysis listed (${c.links.ipc.title})`));
  if (c.hnrp) { L.push(ext(`https://humanitarianaction.info/plan/${c.hnrp.plan_id}`, `${c.hnrp.code} on Humanitarian Action`)); L.push(ext(`https://fts.unocha.org/plans/${c.hnrp.plan_id}/summary`, `${c.hnrp.code} funding on FTS`)); }
  if (c.fews_peak && M.sources.peak_url) L.push(ext(M.sources.peak_url, "FEWS NET peak needs brief"));
  if (c.fews_faob && M.sources.faob_url) L.push(ext(M.sources.faob_url, "FEWS NET monthly outlook brief"));
  L.push(ext("https://ocha-dap.github.io/ds-seas5-skill/app/#hnrp", "SEAS5 viewer · Forecast × HNRP"));
  return `<div class="links">${L.filter(Boolean).join("")}</div>`;
}

// ---- lean seasons affected: rainy season -> harvest -> next lean season (FEWS NET calendars) --
function leanSeasonsAffected(c, w) {
  if (!w || !w.e.regions) return [];
  const m = {};
  for (const [rid, R] of Object.entries(w.e.regions)) {
    for (const im of R.imp || []) {
      const k = `${im.kind}|${im.s}|${im.e}`;
      const x = m[k] || (m[k] = {kind: im.kind, s: im.s, e: im.e, name: im.name, known: 0, nino: 0, nina: 0, neutral: 0, regions: [], feeds: []});
      x.known += im.known[w.key] || 0;
      for (const ph of ["nino", "neutral", "nina"]) x[ph] += im.scen[ph][w.key] || 0;
      x.regions.push(rid); x.feeds.push(...im.feeds);
    }
  }
  // ties (the same people feeding a pastoral and a cropping lean season) go to the cropping one:
  // FEWS NET's peak-needs timing refers to the main lean season
  return Object.values(m).sort((a, b) => b.known - a.known || (a.kind === "crops" ? -1 : 0) - (b.kind === "crops" ? -1 : 0) || a.s.localeCompare(b.s));
}
// the headline is a lean season still to come or under way: one that has already ended is
// history, however many people it held
function topLean(c, w) { const b = leanSeasonsAffected(c, w).filter(x => x.known > 0 && x.e >= BUILT_MONTH); return b.length ? b[0] : null; }

// ---- tooltip -----------------------------------------------------------------------------------
const tip = $("#tip");
document.addEventListener("mousemove", ev => {
  const t = ev.target.closest && ev.target.closest("[data-tip],[data-zone]");
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.hasAttribute("data-zone") ? zoneTip(t.getAttribute("data-zone")) : t.getAttribute("data-tip"); tip.hidden = false;

  const y = ev.clientY + 16 + tip.offsetHeight > innerHeight ? ev.clientY - tip.offsetHeight - 10 : ev.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

// ---- other organisations' figures ---------------------------------------------------------------
function ipcShown(c) {
  if (!c.ipc || !c.ipc.shown) return null;
  const k = c.ipc.shown;
  return c.ipc.periods.find(p => p.t === k.t && p.s === k.s && p.e === k.e) || null;
}
function faobLast(c) { const f = c.fews_faob; return f && f.projected.length ? f.projected[f.projected.length - 1] : null; }
// FEWS NET publishes coarse bins ("9.0 - 9.99 million", ">= 21 million", "100,000 - 499,999"):
// show its own bin edges, compacted, rather than re-rounding them
function fewsRange(r) {
  if (!r) return "—";
  const L = String(r.label || "").trim();
  let m;
  if ((m = L.match(/^>=\s*([\d.]+)\s*million$/i))) return `≥ ${m[1]}M`;
  if ((m = L.match(/^([\d.]+)\s*-\s*([\d.]+)\s*million$/i))) return `${m[1]}–${m[2]}M`;
  if ((m = L.match(/^([\d,]+)\s*-\s*([\d,]+)$/))) {
    // floored, so 999,999 reads 999k (FEWS NET's bin edge), not a rounded 1000k
    const k = x => { const n = Number(x.replace(/,/g, "")); return n >= 1e6 ? (Math.floor(n / 1e4) / 100) + "M" : Math.floor(n / 1e3) + "k"; };
    return `${k(m[1])}–${k(m[2])}`;
  }
  // other shapes seen in the Data Warehouse ("2 - 2.49", "750,000.0 - 999,999.0", "< 100,000"):
  // rebuild from the bin's own numbers, floored so 2,499,999 reads 2.49M like FEWS NET's
  const bin = n => n >= 1e6 ? (Math.floor(n / 1e4) / 100) + "M" : Math.floor(n / 1e3) + "k";
  if (r.high == null) return r.low != null ? `≥ ${bin(r.low)}` : L;
  if (!r.low) return `< ${bin(r.high + 1)}`;
  return `${bin(r.low)}–${bin(r.high)}`;
}
const PERIOD_SHORT = {"current": "Current", "first projection": "Projection", "second projection": "Second projection"};
// concurrent analyses can share a date (Uganda 2026-08: national, and a sub-national one for
// 1.6M people): of the periods covering the month, the one analysing the most people
function ipcAt(c, m) {
  if (!c.ipc) return null;
  const cov = c.ipc.periods.filter(p => p.s <= m && m <= p.e);
  return cov.sort((a, b) => (b.all || 0) - (a.all || 0) || b.s.localeCompare(a.s))[0] || null;
}
function fewsPeakTip(c) {
  const pk = c.fews_peak;
  return `<b>FEWS NET peak needs</b>, edition ${esc(rangeLabel(pk.edition[0], pk.edition[1]))}<br>${esc(fewsRange(pk))} people in Phase 3+ before assistance, peak ${esc(rangeLabel(pk.peak[0], pk.peak[1]))}${pk.areas ? `<br>${esc(pk.areas)}` : ""}`;
}

// ---- table -------------------------------------------------------------------------------------
function expCell(c, cat) {
  const w = wsel(c);
  if (!w) return {v: null, html: `<td class="num muted">—</td>`};
  const v = w.e.cats[cat][w.key], sh = w.total ? v / w.total : null, cls = shareClass(sh);
  const warn = cat === "ending" && c.era5_caveat && v > 0;  // observed + in-season seasons
  const t = `<b>${esc(c.name)}</b> · ${CAT_NAME[cat]}<br>${fmt(v)} of ${fmt(w.total)} (${pct(sh)}) in areas with a dry signal`
    + (warn ? `<br>⚠ ERA5 is known to overstate the 2026 deficit here` : "");
  return {v, html: `<td class="num" data-tip="${esc(t)}">${fmt(v)}${warn ? ` <span class="c-label lab-err">ERA5</span>` : ""}<span class="cbar"><i style="width:${Math.max(0, Math.min(100, (sh || 0) * 100))}%;background:${cls ? SHARE_COL[cls] : "transparent"}"></i></span></td>`};
}
const CAT_NAME = {ending: "season ended or ending (observed / partly observed)", forecast: "SEAS5 forecast", known: "season ending or forecast",
  scenario_nino: "if El Niño persists", scenario_neutral: "if ENSO is neutral", scenario_nina: "if La Niña develops"};

function windowBounds() {
  // the page starts at the first slot it draws (the six observed trimesters are all drawn)
  const first = WIN.find(s => s.shown).start, lastF = WIN.filter(s => s.cat !== "scenario").pop(), last = WIN[WIN.length - 1];
  return {first, seasEnd: addMonths(lastF.start, 2), end: addMonths(last.start, 2)};
}

const COLS = [
  {key: "name", label: "Country", get: c => c.name, str: true},
  {key: "total", label: "Counted", num: true, grp: "ours", get: c => wsel(c)?.total ?? null},
  {key: "ending", label: "Season ended / ending", num: true, grp: "ours", get: c => { const w = wsel(c); return w ? w.e.cats.ending[w.key] : null; }},
  {key: "forecast", label: "SEAS5 forecast", num: true, grp: "ours", get: c => { const w = wsel(c); return w ? w.e.cats.forecast[w.key] : null; }},
  {key: "known", label: "Either", num: true, grp: "ours", get: c => { const w = wsel(c); return w ? w.e.cats.known[w.key] : null; }},
  {key: "nino", label: "El Niño persists", num: true, grp: "ours", get: c => { const w = wsel(c); return w ? w.e.cats.scenario_nino[w.key] : null; }},
  {key: "nina", label: "La Niña develops", num: true, grp: "ours", get: c => { const w = wsel(c); return w ? w.e.cats.scenario_nina[w.key] : null; }},
  {key: "lean", label: "Lean season most affected", num: true, grp: "ours", get: c => topLean(c, wsel(c))?.known ?? null},
  {key: "hnrp", label: "HNRP PiN", num: true, grp: "others", sep: true, get: c => c.hnrp?.in_need ?? null},
  {key: "ipc", label: "IPC/CH Phase 3+", num: true, grp: "others", get: c => ipcShown(c)?.p3 ?? null},
  {key: "peak", label: "FEWS NET peak needs", num: true, grp: "others", get: c => c.fews_peak?.low ?? null},
  {key: "faob", label: "FEWS NET monthly", num: true, grp: "others", get: c => faobLast(c)?.low ?? null},
  {key: "cov", label: "Funded", num: true, grp: "funding", sep: true, get: c => c.hnrp?.coverage ?? null},
];

function shareLegend() {
  return `<div class="legend"><span>Bar shading shows the share of the people counted who are in areas with a dry signal:</span>
    ${[[1, "under 10%"], [2, "10–33%"], [3, "33–66%"], [4, "over 66%"]].map(([k, l]) => `<span><span class="sw" style="background:${SHARE_COL[k]}"></span>${l}</span>`).join("")}
    <span><span class="c-label lab-err">ERA5</span> season-ending figure relies on ERA5, which overstated the 2026 deficit in the flagged countries</span></div>`;
}

function drawTable() {
  const t = $("#tbl"), o = WEIGHTS[state.weight];
  const q = state.q.trim().toLowerCase();
  let rows = D.countries.filter(c => !q || c.name.toLowerCase().includes(q) || c.iso3.toLowerCase().includes(q));
  const col = COLS.find(c => c.key === state.sort.key);
  rows.sort((a, b) => {
    const x = col.get(a), y = col.get(b);
    if (col.str) return state.sort.dir * String(x).localeCompare(String(y));
    if (x == null && y == null) return a.name.localeCompare(b.name);
    if (x == null) return 1; if (y == null) return -1;
    return state.sort.dir * (x - y) || a.name.localeCompare(b.name);
  });
  const th = c => `<th class="sortable ${c.num ? "num" : ""} ${c.sep ? "sep" : ""}" data-k="${c.key}">${esc(c.label)} <span class="arrow">${state.sort.key === c.key ? (state.sort.dir > 0 ? "▲" : "▼") : ""}</span></th>`;
  t.innerHTML = `<thead>
    <tr class="grp"><th></th><th colspan="7" class="ours">Our exposure · ${esc(o.label)} in areas with a dry signal</th><th colspan="4" class="sep">Other organisations' figures, as published</th><th class="sep">Plan funding</th></tr>
    <tr>${COLS.map(th).join("")}</tr></thead><tbody>${rows.map(rowHtml).join("")}</tbody>`;
  t.querySelectorAll("th.sortable").forEach(h => h.addEventListener("click", () => {
    const k = h.dataset.k;
    state.sort = state.sort.key === k ? {key: k, dir: -state.sort.dir} : {key: k, dir: COLS.find(c => c.key === k).str ? 1 : -1};
    drawTable();
  }));
}

function rowHtml(c) {
  const w = wsel(c);
  const name = `<td class="cname"><a href="#/${c.iso3}">${esc(c.name)}</a>${w ? `<span class="sub">${esc(basisNote(c, w))}</span>` : `<span class="sub">no ${WEIGHTS[state.weight].src === "hnrp" ? "HNRP" : "IPC/CH"} areas</span>`}</td>`;
  const total = `<td class="num">${w ? fmt(w.total) : "—"}${w && w.pinOnly ? `<span class="sub">PiN</span>` : ""}</td>`;
  const cells = ["ending", "forecast", "known", "scenario_nino", "scenario_nina"].map(k => expCell(c, k).html).join("");
  const tb = topLean(c, w);
  const leanCell = `<td class="num"${tb ? ` data-tip="${esc(`<b>${esc(tb.name)}, ${rangeLabel(tb.s, tb.e)}</b><br>${fmt(tb.known)} counted in areas with a dry signal on ${esc([...new Set(tb.feeds)].join(" / "))}<br>${tb.kind === "livestock" ? "Pastoral lean season after the rains" : "Lean season after the harvest from those rains"}`)}"` : ""}>${tb ? `${esc(rangeLabel(tb.s, tb.e))}<span class="sub">${fmt(tb.known)}${tb.kind === "livestock" ? " · pastoral" : ""}</span>` : (c.calendar ? "—" : `<span class="muted small">no calendar</span>`)}</td>`;
  const h = c.hnrp;
  const hn = `<td class="num sep">${h ? `<a href="https://humanitarianaction.info/plan/${h.plan_id}" target="_blank" rel="noopener">${fmt(h.in_need)}</a>` : "—"}${h ? `<span class="sub">${h.year} ${esc(h.code)}</span>` : ""}</td>`;
  const ip = ipcShown(c);
  const ipc = `<td class="num">${ip ? (c.links.ipc ? `<a href="${esc(c.links.ipc.link)}" target="_blank" rel="noopener">${fmt(ip.p3)}</a>` : fmt(ip.p3)) : "—"}${ip ? `<span class="sub">${esc(rangeLabel(ip.s, ip.e))}${ip.e < BUILT_MONTH ? " (past)" : ""}</span>` : ""}</td>`;
  const pk = c.fews_peak;
  const peak = `<td class="num"${pk && pk.areas ? ` data-tip="${esc(`<b>Areas of highest concern</b><br>${esc(pk.areas)}`)}"` : ""}>${pk ? esc(fewsRange(pk)) : "—"}${pk ? `<span class="sub">peak ${esc(rangeLabel(...(pk.peak || [])))}${pk.vs_last_year ? ` · <span class="trend-${["Higher", "Lower", "Similar"].includes(pk.vs_last_year) ? pk.vs_last_year : "Similar"}">${pk.vs_last_year === "Higher" ? "↑" : pk.vs_last_year === "Lower" ? "↓" : "≈"} last yr</span>` : ""}</span>` : ""}</td>`;
  const fl = faobLast(c);
  const faob = `<td class="num">${fl ? esc(fewsRange(fl)) : "—"}${fl ? `<span class="sub">for ${esc(monLabel(fl.month))}</span>` : ""}</td>`;
  const cv = h && h.coverage != null ? h.coverage : null;
  const cov = `<td class="num sep">${cv != null ? pct(cv) : "—"}${cv != null ? `<span class="cbar"><i style="width:${Math.min(100, cv * 100)}%;background:var(--n6)"></i></span><span class="sub">of ${usd(h.requirements)}</span>` : ""}</td>`;
  return `<tr>${name}${total}${cells}${leanCell}${hn}${ipc}${peak}${faob}${cov}</tr>`;
}

      ${view === "month" ? `<label class="small"><input type="checkbox" id="showall"${state.showAll ? " checked" : ""}> Include countries with no figures for this count</label>` : ""}

    </div>

  const sa = $("#showall");
  if (sa) sa.addEventListener("change", () => { state.showAll = sa.checked; drawMonth(); });
  const q = $("#q");
  if (q) q.addEventListener("input", e => { state.q = e.target.value; drawTable(); });
  if (view === "table") { $("#gview").innerHTML = `<div class="tbl-wrap"><table id="tbl"></table></div>${shareLegend()}`; drawTable(); }
  else if (view === "map") drawMap();
  else drawMonth();
}

// ---- all countries by month --------------------------------------------------------------------
const GLOBAL_COLS = n => `minmax(170px, 210px) repeat(${n}, minmax(26px, 1fr)) 92px`;

function monthHeader(P, row, months) {
  months.forEach((m0, i) => {
    const {y, m} = ym(m0), yr = m === 1 || i === 0;
    P.push(`<div class="mh${yr ? " y" : ""}${m0 === BUILT_MONTH ? " now" : ""}" style="grid-column:${i + 2};grid-row:${row}">${MON[m - 1]}${yr ? ` ${String(y).slice(2)}` : ""}</div>`);
  });
}

function drawMonth() {
  const AX = gAX(), host = $("#gview"), n = AX.length, o = WEIGHTS[state.weight];
  const withScen = state.scen !== "none" ? ` (incl. the ${SCEN_NAME[state.scen]} scenario)` : "";
  const srcName = o.src === "hnrp" ? "HNRP" : "IPC/CH";
  const first = monthIndex(AX[0]), last = monthIndex(AX[n - 1]);
  const colT = t => t - first + 2, inAx = t => t >= first && t <= last;
  const nowT = monthIndex(BUILT_MONTH), nowCol = inAx(nowT) ? colT(nowT) : null;
  const P = [];
  let row = 1;
  const byReg = {};
  D.countries.forEach(c => (byReg[c.region] = byReg[c.region] || []).push(c));
  const without = [];
  for (const reg of [...M.regions, "Other"]) {
    const all = (byReg[reg] || []).map(c => ({c, w: wsel(c)}));
    const has = all.filter(x => x.w && x.w.total > 0).sort((a, b) => b.w.total - a.w.total || a.c.name.localeCompare(b.c.name));
    const no = all.filter(x => !(x.w && x.w.total > 0)).sort((a, b) => a.c.name.localeCompare(b.c.name));
    without.push(...no.map(x => x.c.name));
    const list = state.showAll ? has.concat(no) : has;
    if (!list.length) continue;
    const regVals = AX.map(m => has.reduce((s, x) => s + leanVal(x.w, m).v, 0));
    const rp = peakOf(regVals, AX);
    P.push(`<div class="g-reg" style="grid-row:${row}"><b>${esc(reg)}</b>${has.length} ${has.length === 1 ? "country" : "countries"} with ${srcName} figures · ${fmt(has.reduce((s, x) => s + x.w.total, 0))} counted${rp ? ` · most in an affected lean season from now on${withScen}: ${fmt(rp.v)}, ${esc(rp.label)}` : ""}</div>`);
    row++;
    monthHeader(P, row, AX);
    P.push(`<div class="mh" style="grid-column:-2 / -1;grid-row:${row};text-align:right">Largest month${state.scen !== "none" ? "*" : ""}</div>`);
    if (nowCol) P.push(`<div class="now-col" style="grid-column:${nowCol};grid-row:${row}"></div>`);
    row++;
    for (const {c, w} of list) {
      const open = state.open.has(c.iso3), fig = w && w.total > 0;
      P.push(`<div class="g-name${fig ? "" : " nofig"}" data-open="${c.iso3}" role="button" tabindex="0" aria-expanded="${open}" style="grid-row:${row} / span 4"><span class="tw">${open ? "▾" : "▸"}</span>${esc(c.name)}${c.era5_caveat ? ` <span class="c-label lab-err">ERA5</span>` : ""}<span class="sub">${fig ? `${fmt(w.total)} counted${w.pinOnly ? " (PiN)" : ""}${c.calendar ? "" : " · no FEWS NET calendar"}` : `no ${srcName} figures`}</span></div>`);
      for (let i = 0; i < 4; i++) P.push(`<div class="g-bg" style="grid-row:${row + i}"></div>`);
      if (fig) {
        const tot = w.total;
        // line 1: dry signal by trimester, on its middle month
        for (const m of AX) {
          const d = dryVal(w, m);
          if (!d || d.off || !d.v) continue;
          const k = shareClass(d.v / tot), era5 = c.era5_caveat && (d.s.cat === "observed" || d.s.cat === "ending");
          const t = `<b>${esc(c.name)}</b> · ${esc(d.s.label)}${d.scen ? ` · ${SCEN_NAME[state.scen]}` : ""}<br>${fmt(d.v)} of ${fmt(tot)} counted (${pct(d.v / tot)}) in areas with a dry signal` + (era5 ? "<br>Relies on ERA5, which overstated the 2026 deficit here" : "");
          P.push(`<div class="g-c${era5 ? " era5" : ""}" style="grid-column:${colT(monthIndex(m))};grid-row:${row};${d.scen ? `background-image:${stripes(DRY_COL[k])}` : `background-color:${DRY_COL[k]}`}" data-tip="${esc(t)}"></div>`);
        }
        // line 2: lean season affected, by month
        for (const m of AX) {
          const lv = leanVal(w, m);
          if (!lv.v) continue;
          const k = shareClass(lv.v / tot), era5 = c.era5_caveat && lv.obs > 0;
          const names = leanNames(c, w, m);
          const t = `<b>${esc(c.name)}</b> · ${monLabel(m)}<br>${fmt(lv.v)} of ${fmt(tot)} counted (${pct(lv.v / tot)}) in a lean season that follows a dry rainy season`
            + (names.length ? `<br>${esc(names.join("; "))}` : "")
            + (lv.v > lv.known ? `<br>${fmt(lv.known)} from observed or forecast seasons, the rest under the ${esc(SCEN_NAME[state.scen])} scenario` : "")
            + (era5 ? "<br>Partly from seasons where ERA5 overstated the 2026 deficit" : "");
          P.push(`<div class="g-c${era5 ? " era5" : ""}" style="grid-column:${colT(monthIndex(m))};grid-row:${row + 1};${lv.known ? `background-color:${LEAN_COL[k]}` : `background-image:${stripes(LEAN_COL[k])}`}" data-tip="${esc(t)}"></div>`);
        }
      }
      // line 3: FEWS NET peak needs window
      const pk = c.fews_peak;
      if (pk && pk.peak) {
        const a = Math.max(monthIndex(pk.peak[0]), first), z = Math.min(monthIndex(pk.peak[1]), last);
        if (z >= a) P.push(`<div class="g-bar fews" style="grid-column:${colT(a)} / ${colT(z) + 1};grid-row:${row + 2}" data-tip="${esc(fewsPeakTip(c))}"></div>`);
      }
      // line 4: IPC/CH periods of the latest analysis
      if (c.ipc) for (const p of c.ipc.periods) {
        const a = Math.max(monthIndex(p.s), first), z = Math.min(monthIndex(p.e), last);
        if (z < a) continue;
        const t = `<b>IPC/CH ${esc(p.t)}</b>, ${esc(rangeLabel(p.s, p.e))} (analysis ${esc(c.ipc.analysis)})<br>Phase 3+: ${fmt(p.p3)} · Phase 4+: ${fmt(p.p4)}`;
        P.push(`<div class="g-bar ipc${p.t === "current" ? " cur" : ""}" style="grid-column:${colT(a)} / ${colT(z) + 1};grid-row:${row + 3}" data-tip="${esc(t)}"></div>`);
      }
      const cp = fig ? peakOf(AX.map(m => leanVal(w, m).v), AX) : null;
      P.push(`<div class="g-end" style="grid-row:${row} / span 4"${cp ? ` data-tip="${esc(`<b>${esc(c.name)}</b>: most people counted in an affected lean season, from this month on${withScen}<br>${fmt(cp.v)} of ${fmt(w.total)} (${pct(cp.v / w.total)}), ${cp.label}`)}"` : ""}>${cp ? `${fmt(cp.v)}<span class="sub">${esc(cp.runs.length > 1 ? `${rangeLabel(...cp.runs[0])} +${cp.runs.length - 1}` : cp.label)}</span>` : `<span class="muted">—</span>`}</div>`);
      if (nowCol) P.push(`<div class="now-col" style="grid-column:${nowCol};grid-row:${row} / span 4"></div>`);
      row += 4;
      if (open) {
        P.push(`<div class="g-exp" style="grid-row:${row}"><div class="g-exp-h"><a href="#/${c.iso3}">Open the ${esc(c.name)} page</a> for the tiles, admin units and notes${w ? ` · ${esc(basisNote(c, w))}` : ""}</div>${countryGrid(c, AX, true)}</div>`);
        row++;
      }
      P.push(`<div class="g-sep" style="grid-row:${row}"></div>`);
      row++;
    }
  }
  host.innerHTML = monthLegend()
    + `<div class="tbl-wrap" style="border:0"><div class="gc" style="grid-template-columns:${GLOBAL_COLS(n)}">${P.join("")}</div></div>`
    + (withScen ? `<p class="small muted">* With the ${esc(SCEN_NAME[state.scen])} scenario, the numbers include people in lean seasons that follow rainy seasons dry only under that scenario (striped).</p>` : "")
    + (without.length && !state.showAll ? `<p class="small muted">No ${srcName} admin-level figures for this count (not shown): ${esc(without.join(", "))}. Tick “Include countries with no figures” to show their FEWS NET and IPC/CH lines, or choose another count.</p>` : "");
  host.querySelectorAll("[data-open]").forEach(el => {
    const toggle = () => { const k = el.dataset.open; state.open.has(k) ? state.open.delete(k) : state.open.add(k); drawMonth(); };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
}

function rampSw(col, striped) {
  return [[1, "under 10%"], [2, "10–33%"], [3, "33–66%"], [4, "over 66%"]].map(([k, l]) =>
    `<span><span class="sw" style="${striped ? `background-image:${stripes(col[k])}` : `background:${col[k]}`}"></span>${l}</span>`).join("");
}
function monthLegend() {
  return `<div class="legend">
    <div class="row"><b>Four lines per country.</b> Click a country to open its full calendar here.</div>
    <div class="row"><span>1 · Dry signal, by trimester (on its middle month), share of the people counted:</span>${rampSw(DRY_COL)}</div>
    <div class="row"><span>2 · Lean season that follows a dry rainy season, by month, share of the people counted:</span>${rampSw(LEAN_COL)}</div>
    <div class="row"><span>3 · <span class="sw" style="background:var(--n8)"></span>FEWS NET peak needs</span><span>4 · <span class="sw" style="background:var(--n4)"></span><span class="sw" style="background:var(--n3)"></span>IPC/CH current period and projections</span>
      <span><span class="sw" style="background-image:${stripes("var(--n7)")}"></span>striped: only under the ENSO scenario chosen above</span>
      <span><span class="sw era5" style="background-color:var(--r2)"></span>dotted: relies on ERA5, which overstated the 2026 Sahel deficit</span>
      <span><span class="sw" style="box-shadow:inset 1px 0 0 var(--p5),inset -1px 0 0 var(--p5)"></span>this month</span></div>
  </div>`;
}

// ---- month grid: one country, every row on the same months ------------------------------------
// Used on the country page and when a country is opened in the all-countries calendar (as a
// subgrid, so its months sit under the calendar's). Our rows: the dry signal by trimester, then
// per FEWS NET calendar region the rains (filled by our dry signal), harvest and lean season
// (filled by the people counted). Then other organisations' timing.
const BAND_NAME = {observed: "Season ended · ERA5", ending: "Ending", forecast: "SEAS5 forecast", scenario: "ENSO scenarios"};
const COUNTRY_COLS = n => `180px repeat(${n}, minmax(34px, 1fr))`;

function countryGrid(c, months, sub = false) {
  const n = months.length, first = monthIndex(months[0]), last = monthIndex(months[n - 1]);
  const colOf = t => t - first + 2, full = `2 / ${n + 2}`;
  const w = wsel(c), o = WEIGHTS[state.weight];
  const P = [];
  let row = 1;
  const lab = (html, rs = 1) => P.push(`<div class="rl" style="grid-row:${row} / span ${rs}">${html}</div>`);
  const note = text => P.push(`<div class="gcell" style="grid-column:${full};grid-row:${row}">${text}</div>`);
  const group = text => { P.push(`<div class="grp-row" style="grid-row:${row}">${text}</div>`); row++; };
  // a section = one label + as many lanes as its bars need (bars in a lane never overlap)
  const section = (label, items, empty = "—") => {
    const lanes = [];
    const placed = items.map(it => {
      const a = Math.max(it.a, first), z = Math.min(it.z, last);
      if (z < a) return null;
      let li = lanes.findIndex(L => L.every(([p, q]) => z < p || a > q));
      if (li < 0) { lanes.push([]); li = lanes.length - 1; }
      lanes[li].push([a, z]);
      return Object.assign({}, it, {a, z, li, clipL: it.a < first, clipR: it.z > last});
    }).filter(Boolean);
    const nl = Math.max(1, lanes.length);
    lab(label, nl);
    placed.forEach(it => P.push(`<div class="bar ${it.cls}" style="grid-column:${colOf(it.a)} / ${colOf(it.z) + 1};grid-row:${row + it.li};${it.style || ""}"${it.tip ? ` data-tip="${esc(it.tip)}"` : ""}>${it.clipL ? "◂ " : ""}${esc(it.text)}${it.clipR ? " ▸" : ""}</div>`));
    if (!placed.length) note(empty);
    row += nl;
  };
  // every occurrence of a calendar span (start/end months) that overlaps the axis
  const occ = sp => {
    const len = ((sp.end - sp.start) % 12 + 12) % 12 + 1, out = [];
    for (let y = Math.floor(first / 12) - 1; y <= Math.floor(last / 12) + 1; y++) {
      const s0 = y * 12 + sp.start - 1, e0 = s0 + len - 1;
      if (e0 >= first && s0 <= last) out.push([s0, e0]);
    }
    return out;
  };

  lab("");
  monthHeader(P, row, months);
  row++;
  lab(`<small>Trimester (cell = middle month)</small>`);
  for (const cat of ["observed", "ending", "forecast", "scenario"]) {
    const sl = WIN.filter(s => s.cat === cat && s.shown);
    if (!sl.length) continue;
    const a = Math.max(monthIndex(sl[0].start) + 1, first), z = Math.min(monthIndex(sl[sl.length - 1].start) + 1, last);
    if (z < a) continue;
    P.push(`<div class="band ${cat === "observed" ? "ending" : cat}" style="grid-column:${colOf(a)} / ${colOf(z) + 1};grid-row:${row}"${cat === "scenario" ? ` data-tip="${esc(iriTip())}"` : ""}>${BAND_NAME[cat]}</div>`);
  }
  row++;

  group(`Our figures · ${esc(o.label)}${w ? ` · ${fmt(w.total)} counted${w.pinOnly ? " (PiN, no severity split)" : ""}` : ""}`);
  lab(`Dry signal<small>share of people counted</small>`);
  if (!w) note(`No ${o.src === "hnrp" ? "HNRP" : "IPC/CH"} admin-level figures for ${esc(c.name)}. Choose another count.`);
  else for (const s of WIN.filter(x => x.shown)) {
    const t = monthIndex(s.start) + 1;
    if (t >= first && t <= last) P.push(dryCell(c, w, s, `grid-column:${colOf(t)};grid-row:${row}`));
  }
  row++;

  if (!c.calendar) {
    lab(`Seasonal calendar`);
    note(`FEWS NET publishes no seasonal calendar for ${esc(c.name)}, so rainy and lean seasons are not shown.`);
    row++;
  } else {
    const RX = w && w.e.regions ? w.e.regions : {};
    const regs = c.calendar.regions, multi = regs.length > 1;
    regs.forEach((r, ri) => {
      const R = RX[r.id];
      if (multi) {
        const meta = [cleanWhere(r.where), r.livelihood, R ? `${R.units} admin unit${R.units === 1 ? "" : "s"}, ${fmt(R.totals[w.key])} counted` : (w ? "no admin units with figures here" : "")].filter(Boolean).join(" · ");
        P.push(`<div class="reg-row" style="grid-row:${row}"><span class="zone" data-zone="${c.iso3}|${esc(r.id)}">${zoneSvg(c, r.id, 20)}<b>${esc(r.name)}</b></span> <span class="muted small">· ${esc(meta)}</span></div>`);
        row++;
      }
      const tot = R && w ? R.totals[w.key] || 0 : 0;
      section(`Rains${ri === 0 ? "<small>FEWS NET; fill: dry signal</small>" : ""}`, rainItems(c, r, R, w, tot, occ));
      section(`Harvest`, (r.harvest || []).flatMap(sp => occ(sp).map(([a, z]) => ({a, z, cls: "cal-harv", text: sp.name.replace(/^Harvest:\s*/i, ""),
        tip: `<b>${esc(sp.name)}</b>, ${rangeLabel(ymS(a), ymS(z))}${sp.rainy ? `<br>from: ${esc(sp.rainy)}` : ""}`}))));
      section(`Lean season${ri === 0 ? "<small>fill: people counted</small>" : ""}`, leanItems(c, r, R, w, tot, occ));
    });
  }

  group(`Other organisations, as published`);
  const pk = c.fews_peak;
  section(`FEWS NET peak needs${pk ? `<small>edition ${esc(rangeLabel(pk.edition[0], pk.edition[1]))}</small>` : ""}`,
    pk && pk.peak ? [{a: monthIndex(pk.peak[0]), z: monthIndex(pk.peak[1]), cls: "gbar", text: `Peak · ${fewsRange(pk)}`, tip: fewsPeakTip(c)}] : [],
    pk ? "No peak window" : "No current edition");
  const fa = c.fews_faob;
  lab(`FEWS NET monthly brief${fa ? `<small>brief of ${esc(monLabel(fa.brief))}</small>` : ""}`);
  let anyF = false;
  if (fa) for (const p of [...(fa.current ? [Object.assign({cur: true}, fa.current)] : []), ...fa.projected]) {
    const t = monthIndex(p.month);
    if (t < first || t > last) continue;
    anyF = true;
    P.push(`<div class="gcell" style="grid-column:${colOf(t)};grid-row:${row}" data-tip="${esc(`<b>FEWS NET ${p.cur ? "current" : "most likely"}, ${monLabel(p.month)}</b><br>${esc(p.label)} people in Phase 3+ (before assistance)`)}">${esc(fewsRange(p))}</div>`);
  }
  if (!anyF) note(fa ? "—" : "Not covered");
  row++;
  section(`IPC/CH${c.ipc ? `<small>analysis ${esc(c.ipc.analysis)}</small>` : ""}`,
    c.ipc ? c.ipc.periods.map(p => ({a: monthIndex(p.s), z: monthIndex(p.e), cls: "gbar light", text: `${PERIOD_SHORT[p.t] || p.t} · Phase 3+ ${fmt(p.p3)}`,
      tip: `<b>IPC/CH ${esc(p.t)}</b>, ${esc(rangeLabel(p.s, p.e))}<br>Phase 3+: ${fmt(p.p3)} · Phase 4+: ${fmt(p.p4)}`})) : [],
    "No analysis since 2022");
  section(`HNRP plan year`, c.hnrp ? [{a: monthIndex(`${c.hnrp.year}-01`), z: monthIndex(`${c.hnrp.year}-12`), cls: "gbar light",
    text: `${c.hnrp.code} · PiN ${fmt(c.hnrp.in_need)}`, tip: `<b>${esc(c.hnrp.name)}</b>`}] : [], "No current plan");

  const nowT = monthIndex(BUILT_MONTH);
  if (nowT >= first && nowT <= last) P.push(`<div class="now-col" style="grid-column:${colOf(nowT)};grid-row:1 / ${row}"></div>`);
  return `<div class="mg${sub ? " sub" : ""}"${sub ? "" : ` style="grid-template-columns:${COUNTRY_COLS(n)}"`}>${P.join("")}</div>`;
}

function dryCell(c, w, s, pos) {
  const sl = w.e.slots[s.key], tot = w.total || 0, rainyW = sl["rainy_" + w.key] || 0, shR = tot ? rainyW / tot : 0;
  const off = t => `<div class="cell2 offseason" style="${pos}" data-tip="${esc(t + `<br>Outside the rainy season for ${pct(1 - shR)} of the people counted`)}"><span class="t">${s.tri}</span><span class="x">·</span></div>`;
  if (s.cat === "scenario") {
    const vals = Object.fromEntries(["nino", "neutral", "nina"].map(ph => [ph, sl[`${ph}_${w.key}`] || 0]));
    const ph = vals.nino >= vals.nina ? "nino" : "nina", v = vals[ph];
    const t = `<b>${s.label}</b> · ENSO scenarios (how often the season was dry in past years of each phase)<br>`
      + ["nino", "neutral", "nina"].map(p => `${SCEN_NAME[p]}: ${fmt(vals[p])} of ${fmt(tot)} (${pct(tot ? vals[p] / tot : 0)}) in areas with a dry signal`).join("<br>");
    if (!v && shR < 0.05) return off(t);
    const k = shareClass(tot ? v / tot : 0);
    if (!k) return `<div class="cell2 scen" style="${pos}" data-tip="${esc(t)}"><span class="t">${s.tri}</span><span class="x">0</span></div>`;
    return `<div class="cell2 scen" style="${pos};border-color:${DRY_COL[k]}" data-tip="${esc(t)}"><span class="t">${ph === "nino" ? "El Niño" : "La Niña"}</span><span class="x">${fmt(v)}</span></div>`;
  }
  const v = sl[w.key] || 0;
  const t = `<b>${s.label}</b> · ${s.cat === "observed" ? "season ended, observed (ERA5): dry when in its own driest third of the record" : s.cat === "ending" ? `season ending, lead ${s.lead} (${-s.lead === 2 ? "2 of 3" : "1 of 3"} months observed)` : `SEAS5 forecast, lead ${s.lead}`}<br>`
    + `${fmt(v)} of ${fmt(tot)} counted (${pct(tot ? v / tot : 0)}) in areas with a dry signal<br>${fmt(rainyW)} in areas where this trimester is in the rainy season`;
  if (!v && shR < 0.05) return off(t);
  const k = shareClass(tot ? v / tot : 0), era5 = (s.cat === "ending" || s.cat === "observed") && c.era5_caveat && v > 0;
  return `<div class="cell2${k ? "" : " none"}${era5 ? " era5" : ""}" style="${pos};${k ? `background-color:${DRY_COL[k]};color:${inkOn(k, "dry")}` : ""}" data-tip="${esc(t + (era5 ? "<br>ERA5 overstated the 2026 deficit here" : ""))}"><span class="t">${s.tri}</span><span class="x">${fmt(v)}</span></div>`;
}

// FEWS NET's rainy seasons, filled with our dry signal where the outlook window covers them
function rainItems(c, r, R, w, tot, occ) {
  return (r.rainy || []).flatMap(sp => occ(sp).map(([a, z]) => {
    const head = `<b>${esc(sp.name)}</b>, ${rangeLabel(ymS(a), ymS(z))} (FEWS NET calendar)`;
    const len = ((sp.end - sp.start) % 12 + 12) % 12 + 1;
    if (sp.minor || len >= 11) return {a, z, cls: "cal-rain minor", text: sp.name, tip: head + "<br>Minor or year-round rains: not linked to a lean season here"};
    const oc = R && R.occ.find(x => x.season === sp.name && monthIndex(x.s) === a);
    if (!oc || !w) return {a, z, cls: "cal-rain", text: sp.name, tip: head + (!w ? "" : !R ? "<br>No admin units with figures in this region" : "<br>Not assessed: no trimester in the outlook window covers it")};
    const v = oc.known[w.key] || 0, hasKnown = oc.cats.some(x => x !== "scenario"), sc = oc.scen;
    const tipText = head + `<br>Trimesters covering it: ${oc.tris.join(", ")} (${oc.cats.map(x => ({observed: "observed (ERA5)", ending: "season ending", forecast: "SEAS5 forecast", scenario: "ENSO scenario"}[x])).join(", ")})`
      + (hasKnown ? `<br>${fmt(v)} of ${fmt(tot)} counted in this region (${pct(tot ? v / tot : 0)}) in areas with a dry signal` : "")
      + (v > 0 && oc.dry_tris && oc.dry_tris.length ? `<br>Trimesters with a dry signal: ${esc(oc.dry_tris.join(", "))}` : "")
      + (oc.cats.includes("scenario") ? `<br>ENSO scenarios: El Niño ${fmt(sc.nino[w.key])} · neutral ${fmt(sc.neutral[w.key])} · La Niña ${fmt(sc.nina[w.key])}` : "")

// Bubbles as in the pa-aa-fji-storms maps (src/plotting.py: _resolve_overlaps, bullseye
// exposures): each circle starts on its country's label point in an equal-area projection; a
// spring pulls it home and overlapping circles push each other apart, so circles stay near their
// country without covering each other. The outer circles are laid out once per source, so
// stepping through the months changes only the inner discs.
const MAP_W = 1000, MAP_H = 480;

function resolveOverlaps(nodes, {kSpring = 1e-3, kRepulse = 1, friction = 0.85, maxStep = 4, iters = 500, pad = 1.5} = {}) {
  for (const n of nodes) { n.x = n.hx; n.y = n.hy; n.vx = 0; n.vy = 0; }
  for (let it = 0; it < iters; it++) {
    for (const n of nodes) { n.fx = -kSpring * (n.x - n.hx); n.fy = -kSpring * (n.y - n.hy); }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {

      if (ov > 0) { const f = kRepulse * ov; a.fx -= f * ux; a.fy -= f * uy; b.fx += f * ux; b.fy += f * uy; }
    }
    for (const n of nodes) {
      n.vx = (n.vx + n.fx) * friction; n.vy = (n.vy + n.fy) * friction;
      const s = Math.hypot(n.vx, n.vy);

      n.x += n.vx; n.y += n.vy;

}
