<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Humanitarian Outlook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --b6:#1e795f; --b05:#e9f5f1; --b1:#d4eae4;
    --n9:#1f2324; --n7:#5e6a6b; --n15:#e2e8e8; --n05:#f5f7f7; --e6:#9d372b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--n05); color: var(--n9); font: 400 15px/1.55 'Roboto', system-ui, sans-serif; }
  .home-link { display: inline-block; margin: 10px 12px; padding: 6px 12px; font: 500 13px/1 'Roboto', system-ui, sans-serif;
    color: var(--b6); background: var(--b05); border: 1px solid var(--b1); border-radius: 4px; text-decoration: none; }
  .home-link:hover { background: var(--b1); }
  .gate { max-width: 460px; margin: 12vh auto 0; padding: 0 16px; }
  .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--n7); margin: 0 0 8px; }
  h1 { font-family: 'Merriweather', Georgia, serif; font-size: 24px; line-height: 1.3; margin: 0 0 10px; }
  p { color: var(--n7); margin: 0 0 12px; }
  form { display: flex; gap: 10px; margin: 18px 0 10px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 6px; border: 1.5px solid var(--n15); background: #fff; color: var(--n9); }
  input:focus { outline: 2px solid var(--b6); outline-offset: 1px; }
  button { font: inherit; font-weight: 500; padding: 10px 18px; border-radius: 6px; border: 0; background: var(--b6); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .err { color: var(--e6); font-size: 14px; min-height: 1.3em; margin: 0; }
  .lock { font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<a class="home-link" href="../">← Humanitarian outlook</a>
<div class="gate" id="gate">
  <p class="kicker">OCHA Centre for Humanitarian Data</p>
  <h1>Year-ahead outlook by country</h1>
  <p>Restricted access. Enter the password to open the page.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="Password" aria-label="Password" required>
    <button id="go" type="submit">Open</button>
  </form>
  <p class="err" id="err" role="alert"></p>
  <p class="lock">The content is encrypted in the page and decrypted in your browser; nothing is sent to a server.</p>
</div>
<script>
// Same format as ds-aa-bfa-drought/scripts/hnrp_2027/gate.html: page.enc = base64(salt[16] | iv[12] |
// AES-256-GCM ciphertext+tag), key = PBKDF2-HMAC-SHA256(password, salt, 300 000 iterations).
var ITER=300000, KEY='outlook';
function b64(s){var b=atob(s.replace(/\s+/g,"")),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function decryptPage(pw){
  var raw=b64(await (await fetch('page.enc',{cache:'no-cache'})).text());
  var salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct));
}
async function attempt(pw,fromStore){
  var btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true; err.textContent='';
  try{
    var html=await decryptPage(pw);
    try{ sessionStorage.setItem(KEY,pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    try{ sessionStorage.removeItem(KEY); }catch(_){}
    document.getElementById('gate').hidden=false;
    if(!fromStore){ err.textContent='Wrong password.'; document.getElementById('pw').select(); }
    btn.disabled=false;
  }
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault(); attempt(document.getElementById('pw').value,false);});
var st=null; try{ st=sessionStorage.getItem(KEY); }catch(e){}
if(st){ document.getElementById('gate').hidden=true; attempt(st,true); } else { document.getElementById('pw').focus(); }
</script>
</body>
</html>
