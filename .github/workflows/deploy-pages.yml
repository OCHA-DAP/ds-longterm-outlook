name: Deploy Pages

# Serves docs/ as it is in main: the landing page plus the encrypted outlook
# (docs/outlook/page.enc, built locally by pipeline/build_page.py --publish). Nothing is
# built here and no secret is needed.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish a plaintext outlook
        run: |
          if grep -rl '__DATA__\|"countries":\[' docs/ ; then
            echo "docs/ holds unencrypted outlook data" >&2; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
