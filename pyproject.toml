[project]
name = "ds-longterm-outlook"
version = "0.1.0"
description = "Year-ahead humanitarian outlook per country: our forecast x PiN exposure next to FEWS NET, IPC/CH and HNRP figures"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=43",
    "numpy>=1.26",
    "ocha-stratus>=0.1.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "pycountry>=24",
    "rasterio>=1.4,<1.5.2",  # 1.5.2 ships no macOS wheel and its sdist needs distutils
    "requests>=2.32",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook"]
